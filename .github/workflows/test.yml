name: test

on:
  push:
    branches: [main]
  pull_request:
  # GitHub's merge queue (not enabled: docs/cloud.md "Back-to-back merges"). Inert until a ruleset turns it on.
  merge_group:

permissions:
  contents: read

# A PR's new push cancels its older run. A run on main is NEVER cancelled or queued behind another: each has its own
# group (the run id), so merging PRs back to back tests every merge to the end, and deploy.yml (which starts when
# one passes) deploys the newest commit that passed. One shared group for main would cancel them: GitHub keeps at
# most one pending run per group even without cancel-in-progress.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('test-{0}', github.ref) || format('test-{0}-{1}', github.ref, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: "Litestream (the hub image pin, sha256-checked, for the real-Litestream takeover and reseed tests)"
        env:
          LITESTREAM_VERSION: "0.5.18"
          LITESTREAM_SHA256_AMD64: d3687b9fd0f2e9426bbd3da828429ff3f1dfc5c9b74d54fdf028e4ee510e7dea
        run: |
          set -eu
          curl -fsSL -o /tmp/litestream.tgz "https://github.com/benbjohnson/litestream/releases/download/v${LITESTREAM_VERSION}/litestream-${LITESTREAM_VERSION}-linux-x86_64.tar.gz"
          echo "${LITESTREAM_SHA256_AMD64}  /tmp/litestream.tgz" | sha256sum -c -
          sudo tar -xzf /tmp/litestream.tgz -C /usr/local/bin litestream
          litestream version
      # Tests marked @pytest.mark.flaky (known flakes, each with its issue) get one retry on failure: "R" in the
      # progress, "N rerun" in the totals and a warning annotation (tests/conftest.py). Any other failure is final.
      # PYTHONFAULTHANDLER: a crash in C before or after pytest's own faulthandler (on during the session) still dumps.
      # A run still going after 21 min (a good one takes 10-19) has stalled (#740: twice at 98%, silent until the job
      # timeout): its processes are listed and SIGUSR1 makes the controller and every worker print every thread's
      # stack and go on (tests/conftest.py). The step's own timeout leaves the job time for the step below.
      - name: pytest
        timeout-minutes: 27
        env:
          PYTHONFAULTHANDLER: "1"
        run: |
          python -m pytest -q -p no:cacheprovider -n auto --dist loadfile &
          pytest_pid=$!
          ( sleep 1260
            echo "::warning::pytest still running after 21 min (#740): its processes and every thread's stack follow"
            ps -o pid,ppid,etime,rss,args -p "$pytest_pid" --ppid "$pytest_pid" || true
            kill -USR1 "$pytest_pid" 2>/dev/null || true
            pkill -USR1 -P "$pytest_pid" || true ) &
          watchdog=$!
          rc=0
          wait "$pytest_pid" || rc=$?
          pkill -P "$watchdog" 2>/dev/null || true
          kill "$watchdog" 2>/dev/null || true
          exit "$rc"
      # A worker that died without a word ("node down", #740): the conftest says its exit status; a SIGKILL there is
      # most likely the OOM killer, which only the kernel log names. Also after a timeout (cancelled).
      - if: failure() || cancelled()
        run: |
          free -m || true
          sudo dmesg -T 2>/dev/null | grep -iE "out of memory|oom|killed process" | tail -20 || true
          ps -eo pid,ppid,etime,rss,args | grep -E "[p]ython" || true

  image:
    # The hub image (docs/cloud.md): build it and check it serves /healthz with no radios, no
    # whisper and no voice server, the way it runs on Fargate (without Litestream).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t sizeup-hub:ci .
      - run: docker run --rm --entrypoint python sizeup-hub:ci -B -m sizeup.web.bundle --check   # /cad's bundles built
      - run: |
          docker run -d --name hub -e SIZEUP_HOST=0.0.0.0 -e SIZEUP_STATION_TOKEN="$(openssl rand -hex 32)" -p 8090:8090 sizeup-hub:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8090/healthz && break; sleep 2; done
          curl -fsS http://127.0.0.1:8090/healthz
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8090/cad)" = 401   # identity on: needs Access sign-in
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8090/api/station/events)" = 401
      - if: always()
        run: docker logs hub 2>&1 | tail -50
