name: test

on:
  push:
    branches: [main]
  pull_request:
  # GitHub's merge queue (not enabled: docs/cloud.md "Back-to-back merges"). Inert until a ruleset turns it on.
  merge_group:

permissions:
  contents: read

# A PR's new push cancels its older run. A run on main is NEVER cancelled or queued behind another: each has its own
# group (the run id), so merging PRs back to back tests every merge to the end, and deploy.yml (which starts when
# one passes) deploys the newest commit that passed. One shared group for main would cancel them: GitHub keeps at
# most one pending run per group even without cancel-in-progress.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('test-{0}', github.ref) || format('test-{0}-{1}', github.ref, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  shard:
    # The suite in parallel shards (tools/ci_shard.py): whole test files, balanced by recorded durations, so the
    # same tests run under the same `--dist loadfile`. The shard count is the matrix's own size (strategy.job-total),
    # and the `pytest` job below fails unless every shard passed.
    name: pytest (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - name: "The GPU worker as installed before its move (tests/test_stt_worker_move.py: its self-update across it)"
        # f13acff2: the installer the first worker came from; 39c4de4b: the worker.py it pins. The shallow checkout
        # hasn't them; one commit each, no history
        run: git fetch --no-tags --depth=1 origin f13acff29be3623cfd4f9410300c1886364ac817 39c4de4b155d1a03db14168c66dcb57954f0ae12
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: "Litestream (the hub image pin, sha256-checked, for the real-Litestream takeover and reseed tests)"
        env:
          LITESTREAM_VERSION: "0.5.18"
          LITESTREAM_SHA256_AMD64: d3687b9fd0f2e9426bbd3da828429ff3f1dfc5c9b74d54fdf028e4ee510e7dea
        run: |
          set -eu
          curl -fsSL -o /tmp/litestream.tgz "https://github.com/benbjohnson/litestream/releases/download/v${LITESTREAM_VERSION}/litestream-${LITESTREAM_VERSION}-linux-x86_64.tar.gz"
          echo "${LITESTREAM_SHA256_AMD64}  /tmp/litestream.tgz" | sha256sum -c -
          sudo tar -xzf /tmp/litestream.tgz -C /usr/local/bin litestream
          litestream version
      - name: "This shard's test files (its own step: a failure here must stop the job, not run every test)"
        run: |
          set -eu
          # strategy.job-index counts from 0, the tool's shards from 1
          SHARD=$(( ${{ strategy.job-index }} + 1 ))
          python tools/ci_shard.py "$SHARD" "${{ strategy.job-total }}" > /tmp/shard-files.txt 2>/tmp/shard-err.txt \
            || { cat /tmp/shard-err.txt; exit 1; }
          echo "shard $SHARD of ${{ strategy.job-total }}: $(wc -l < /tmp/shard-files.txt) test files"
      - name: "The runner before the tests (#984: what it has, so a shortage later shows against it)"
        run: bash tools/ci_resources.sh snapshot "before the tests"
      # Tests marked @pytest.mark.flaky (known flakes, each with its issue) get one retry on failure: "R" in the
      # progress, "N rerun" in the totals and a warning annotation (tests/conftest.py). Any other failure is final.
      # PYTHONFAULTHANDLER: a crash in C before or after pytest's own faulthandler (on during the session) still dumps.
      # A shard still going after 21 min (the whole unsharded suite took 10-19) has stalled (#740: twice at 98%,
      # silent until the job timeout): its processes are listed and SIGUSR1 makes the controller and every worker
      # print every thread's stack and go on (tests/conftest.py). The step's own timeout leaves the job time for the
      # steps below.
      # #984: a runner out of memory does not fail the job, it dies, and GitHub keeps no log at all ("The runner has
      # received a shutdown signal", or only the job's time limit). So the tests run in a memory cgroup of their own,
      # 2 GB under the runner's memory and with no swap: at the limit the kernel kills one test process (xdist says
      # "node down" and the conftest "killed by SIGKILL") and the runner lives on. tools/ci_resources.sh samples the
      # runner every 10 s (one line a minute here, all of them in the artifact) and stops the tests itself before
      # the disk runs out.
      - name: pytest
        timeout-minutes: 27
        env:
          PYTHONFAULTHANDLER: "1"
        # pytest in the foreground: a background job starts with SIGINT ignored, and then Python never turns SIGINT
        # into KeyboardInterrupt (_thread.interrupt_main does nothing; test_stt_worker's long-poll stop hung).
        run: |
          mkdir -p /tmp/ci
          limit=$(( $(awk '$1 == "MemTotal:" {print int($2 / 1024)}' /proc/meminfo) - 2048 ))
          cg=/sys/fs/cgroup/ci-tests
          if echo +memory | sudo tee /sys/fs/cgroup/cgroup.subtree_control > /dev/null && sudo mkdir -p "$cg" && echo "${limit}M" | sudo tee "$cg/memory.max" > /dev/null \
              && echo 0 | sudo tee "$cg/memory.swap.max" > /dev/null && echo $$ | sudo tee "$cg/cgroup.procs" > /dev/null; then
            echo "the tests' memory cgroup: at most ${limit} MB, no swap"
          else
            echo "::warning::no memory cgroup for the tests (#984): a shortage may take the runner down with no log"
          fi
          pytest_pid() { ps -A -o pid=,ppid=,comm= | awk -v p="$$" '$2 == p && $3 ~ /[Pp]ython[0-9.]*$/ {print $1; exit}'; }
          ( sleep 1260
            pid=$(pytest_pid)
            echo "::warning::pytest (this shard) still running after 21 min (#740): its processes and every thread's stack follow"
            ps -o pid,ppid,etime,rss,args -p "$pid" --ppid "$pid" || true
            kill -USR1 "$pid" 2>/dev/null || true
            pkill -USR1 -P "$pid" || true ) &
          watchdog=$!
          ( for _ in $(seq 60); do pid=$(pytest_pid); [ -n "$pid" ] && break; sleep 1; done
            [ -n "$pid" ] && exec bash tools/ci_resources.sh watch "$pid" /tmp/ci/resources.txt ) &
          watcher=$!
          rc=0
          python -m pytest -q -p no:cacheprovider -n auto --dist loadfile \
            --junitxml=/tmp/ci/junit.xml -o junit_family=xunit1 $(cat /tmp/shard-files.txt) || rc=$?
          pkill -P "$watchdog" 2>/dev/null || true
          kill "$watchdog" "$watcher" 2>/dev/null || true
          exit "$rc"
      # A worker that died without a word ("node down", #740): the conftest says its exit status; a SIGKILL there is
      # most likely the OOM killer, which the kernel log and the cgroup's memory.events name. Also after a timeout.
      - name: "The runner after the tests (#984)"
        if: always()
        run: |
          bash tools/ci_resources.sh snapshot "after the tests"
          ps -eo pid,ppid,etime,rss,args | grep -E "[p]ython" || true
          if [ -s /tmp/ci/resources.txt ]; then
            echo "-- the tests' peaks: $(awk 'NR > 1 { if (min == "" || $2 < min) min = $2; if ($3 > sw) sw = $3;
              if ($4 > ld) ld = $4; if ($8 > rss) rss = $8 } END {print "available memory down to " min " MB, swap " sw \
              " MB, load " ld ", the tests " rss " MB"}' /tmp/ci/resources.txt)"
          fi
      # The samples and the junit report (each test's time: `tools/ci_shard.py --refresh` balances the shards by them)
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
          path: /tmp/ci/
          retention-days: 14
          if-no-files-found: ignore

  pytest:
    # One check named `pytest`, as before: green only when every shard is.
    needs: shard
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: test "${{ needs.shard.result }}" = "success"

  image:
    # The hub image (docs/cloud.md): build it and check it serves /healthz with no radios, no
    # whisper and no voice server, the way it runs on Fargate (without Litestream).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t sizeup-hub:ci .
      - run: docker run --rm --entrypoint python sizeup-hub:ci -B -m sizeup.web.bundle --check   # /cad's bundles built
      - run: |
          docker run -d --name hub -e SIZEUP_HOST=0.0.0.0 -e SIZEUP_STATION_TOKEN="$(openssl rand -hex 32)" -p 8090:8090 sizeup-hub:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8090/healthz && break; sleep 2; done
          curl -fsS http://127.0.0.1:8090/healthz
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8090/cad)" = 401   # identity on: needs Access sign-in
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8090/api/station/events)" = 401
      - if: always()
        run: docker logs hub 2>&1 | tail -50
