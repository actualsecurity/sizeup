name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Litestream (the hub image's pin, sha256-checked: the real-Litestream takeover and reseed tests)
        env:
          LITESTREAM_VERSION: "0.5.18"
          LITESTREAM_SHA256_AMD64: d3687b9fd0f2e9426bbd3da828429ff3f1dfc5c9b74d54fdf028e4ee510e7dea
        run: |
          set -eu
          curl -fsSL -o /tmp/litestream.tgz "https://github.com/benbjohnson/litestream/releases/download/v${LITESTREAM_VERSION}/litestream-${LITESTREAM_VERSION}-linux-x86_64.tar.gz"
          echo "${LITESTREAM_SHA256_AMD64}  /tmp/litestream.tgz" | sha256sum -c -
          sudo tar -xzf /tmp/litestream.tgz -C /usr/local/bin litestream
          litestream version
      - run: python -m pytest -q -p no:cacheprovider -n auto --dist loadfile

  image:
    # The hub image (docs/cloud.md): build it and check it serves /healthz with no radios, no
    # whisper and no voice server, the way it runs on Fargate (without Litestream).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t sizeup-hub:ci .
      - run: |
          docker run -d --name hub -e SIZEUP_HOST=0.0.0.0 -e SIZEUP_STATION_TOKEN="$(openssl rand -hex 32)" -p 8090:8090 sizeup-hub:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8090/healthz && break; sleep 2; done
          curl -fsS http://127.0.0.1:8090/healthz
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8090/cad)" = 401   # identity on: needs Access sign-in
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8090/api/station/events)" = 401
      - if: always()
        run: docker logs hub 2>&1 | tail -50
