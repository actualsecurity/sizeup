name: deploy

# After the tests pass on main: build the arm64 hub image, push it to ECR and roll the ECS
# service. AWS access is a short-lived OIDC role, no stored keys. Both containers of the task run this
# image: "hub" (sizeup/handoff.py) and "cloudflared" (deploy/hub/connector.sh), #247.
# Then the deploy checks itself (#79): it waits up to 15 min for the station to report the new build
# (tools/deploy_check.py) and fails if it doesn't. Secrets (docs/cloud.md "Station health and alerts"):
# SIZEUP_STATUS_TOKEN (read only), SIZEUP_ACCESS_CLIENT_ID / _SECRET (a Cloudflare Access service token);
# without SIZEUP_STATUS_TOKEN the check is skipped with a warning. vars.SIZEUP_HUB_URL overrides the URL.
# Before that, the replicas: the new leader's own check of each must pass (tools/deploy_check.py replicas reads its
# record, replica-watch.json, and nothing else: sizeup-aws/28-replica-watch.sh).
on:
  workflow_run:
    workflows: [test]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE }}
          aws-region: ${{ vars.AWS_REGION }}
      # Every SSM parameter the task definition names must exist before anything is built or ECS touched: a task whose
      # secret is missing never starts, and the service would roll to it. Names only (ssm:DescribeParameters: metadata,
      # never a value; sizeup-aws/23-deploy-ssm-describe.sh grants it).
      - name: Every secret the task definition names is in SSM
        shell: bash
        run: |
          err=$(mktemp)
          cant() {   # AWS refused or unreachable: say so, never "missing"
            c=$(grep -oE '\([A-Za-z]+(Exception|Error)?\)' "$err" | head -n1 | tr -d '()' || true)
            echo "::error title=Could not check SSM::could not check SSM: ${c:-$(head -n1 "$err" | cut -c1-200)} ($1); nothing was deployed"
            exit 1
          }
          acct=$(aws sts get-caller-identity --query Account --output text 2>"$err") || cant "sts get-caller-identity"
          names=$(python3 tools/taskdef_params.py deploy/aws/taskdef.json --region "$AWS_REGION" --account "$acct") || {
            echo "::error title=Task definition secrets::deploy/aws/taskdef.json: see the line above; nothing was deployed"
            exit 1
          }
          found=$(aws ssm describe-parameters \
            --parameter-filters "Key=Name,Option=Equals,Values=$(paste -sd, - <<<"$names")" \
            --query 'Parameters[].Name' --output text 2>"$err") || cant "ssm describe-parameters"
          missing=$(comm -23 <(sort -u <<<"$names") <(tr '\t' '\n' <<<"$found" | sort -u))
          if [ -n "$missing" ]; then
            for n in $missing; do
              echo "::error title=Missing SSM parameter::$n is named in deploy/aws/taskdef.json but not in SSM: create it (sizeup-aws) before deploying; nothing was deployed"
            done
            exit 1
          fi
          echo "All $(wc -l <<<"$names" | tr -d ' ') SSM parameters the task definition names exist."
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          provenance: false
          # the full git sha: /healthz and the station link report it, and stations follow it
          # (sizeup/cloud/autoupdate.py matches it against git)
          build-args: |
            SIZEUP_BUILD=${{ env.SHA }}
          tags: ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ env.SHA }}
      - id: td
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: deploy/aws/taskdef.json
          container-name: hub
          image: ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ env.SHA }}
      - id: td2
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ steps.td.outputs.task-definition }}
          container-name: cloudflared
          image: ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ env.SHA }}
      - id: svc
        run: echo "exists=$(aws ecs describe-services --cluster sizeup-hub --services sizeup-hub --query 'length(services[?status==`ACTIVE`])' --output text)" >> "$GITHUB_OUTPUT"
      - id: deploy
        if: steps.svc.outputs.exists == '1'
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.td2.outputs.task-definition }}
          cluster: sizeup-hub
          service: sizeup-hub
          wait-for-service-stability: true
      - if: steps.svc.outputs.exists != '1'
        run: |
          aws ecs register-task-definition --cli-input-json "file://${{ steps.td2.outputs.task-definition }}" >/dev/null
          echo "::notice::Task definition registered; the ECS service isn't created yet (sizeup-aws/9-service.sh)."
      # The replicas as the new leader verified them (2026-11-13: a corrupt cad.sqlite replica sat unnoticed for ~110 min,
      # until the next takeover failed). The hub checks them itself (sizeup/replicawatch.py, 2 min after it serves); this
      # reads ONLY its record, replica-watch.json: no database leaves AWS (the deploy role may GetObject that one key:
      # sizeup-aws/28-replica-watch.sh).
      - name: The new leader verified the replicas
        if: ${{ !cancelled() && steps.deploy.outcome == 'success' }}
        timeout-minutes: 12
        run: python3 tools/deploy_check.py replicas --build "$SHA" --timeout 600
      - name: Wait for the station to run this build
        if: ${{ !cancelled() && steps.deploy.outcome == 'success' }}
        timeout-minutes: 17
        env:
          SIZEUP_STATUS_TOKEN: ${{ secrets.SIZEUP_STATUS_TOKEN }}
          SIZEUP_ACCESS_CLIENT_ID: ${{ secrets.SIZEUP_ACCESS_CLIENT_ID }}
          SIZEUP_ACCESS_CLIENT_SECRET: ${{ secrets.SIZEUP_ACCESS_CLIENT_SECRET }}
          SIZEUP_HUB_URL: ${{ vars.SIZEUP_HUB_URL || 'https://sizeup.actualsecurity.org' }}
        run: |
          if [ -z "$SIZEUP_STATUS_TOKEN" ]; then
            echo "::warning title=Station check skipped::Add the SIZEUP_STATUS_TOKEN secret (and SIZEUP_ACCESS_CLIENT_ID / SIZEUP_ACCESS_CLIENT_SECRET) to check that the station follows: docs/cloud.md, Station health and alerts"
            exit 0
          fi
          python3 tools/deploy_check.py --url "$SIZEUP_HUB_URL" --build "$SHA" --timeout 900
