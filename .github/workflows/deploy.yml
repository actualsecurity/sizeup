name: deploy

# After the tests pass on main: build the arm64 hub image, push it to ECR and roll the ECS
# service. AWS access is a short-lived OIDC role, no stored keys. Both containers of the task run this
# image: "hub" (sizeup/handoff.py) and "cloudflared" (deploy/hub/connector.sh), #247.
# Then the deploy checks itself (#79): it waits up to 15 min for the station to report the new build
# (tools/deploy_check.py) and fails if it doesn't. Secrets (docs/cloud.md "Station health and alerts"):
# SIZEUP_STATUS_TOKEN (read only), SIZEUP_ACCESS_CLIENT_ID / _SECRET (a Cloudflare Access service token);
# without SIZEUP_STATUS_TOKEN the check is skipped with a warning. vars.SIZEUP_HUB_URL overrides the URL.
# Before that, the replicas: the new leader's own check of each must pass (tools/deploy_check.py replicas reads its
# record, replica-watch.json, and nothing else: sizeup-aws/28-replica-watch.sh).
#
# Back-to-back merges (docs/cloud.md "Back-to-back merges"): main's test runs are never cancelled (test.yml), so each
# merge that passes starts a run here, in any order. Runs wait in one queue (the "deploy" group: one at a time; GitHub
# keeps only the newest waiting run and cancels an older waiting one, which is fine because of what comes next). The
# first job, pick, chooses what to deploy when the run actually starts: the NEWEST commit on main (from the one that
# started this run up to main's tip) whose test push run passed, or nothing when that commit or a newer one is already
# deployed (tools/deploy_check.py pick, GitHub reads only). So three quick merges deploy the first and then the third,
# and a merge whose run was cancelled from the queue still reaches ECS with a later run. The deploy job is named
# "deploy <sha>": that is how the next pick knows what was deployed. Then, with the AWS credentials, the guard reads
# what ECS actually runs and deploys only that commit or a descendant of it (git ancestry): never an older commit over
# a newer one, whatever the run history says (a re-run of an old run, for one). Fails closed.
# By hand (workflow_dispatch): deploys exactly the chosen ref, no pick and no guard: that is the rollback.
# Pause: the repository variable DEPLOY_PAUSED = true (Settings > Secrets and variables > Actions > Variables) skips
# every automatic deploy, e.g. after a rollback; a deploy by hand still works. Delete it (or set false) to resume: the
# next merge that passes deploys the newest tested commit.
on:
  workflow_run:
    workflows: [test]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

# Only runs that may deploy share the queue: a run for a failed or cancelled test run, or one while deploys are paused
# (skipped below), gets a group of its own, so it never pushes a waiting deploy out of the queue. Automatic deploys come
# only from a push run on main.
concurrency:
  group: ${{ (github.event_name == 'workflow_dispatch' || (vars.DEPLOY_PAUSED != 'true' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')) && 'deploy' || format('deploy-skipped-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  pick:
    if: github.event_name == 'workflow_dispatch' || (vars.DEPLOY_PAUSED != 'true' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read     # the test and deploy runs (GitHub API, read only)
      contents: read
    outputs:
      sha: ${{ steps.pick.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools
      - id: pick
        name: The newest tested commit on main
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TESTED: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            echo "::notice title=Deploying::$GITHUB_SHA ($GITHUB_REF_NAME, by hand)"
            echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 tools/deploy_check.py pick --repo "$GITHUB_REPOSITORY" --sha "$TESTED" --run-id "$GITHUB_RUN_ID"

  deploy:
    needs: pick
    if: needs.pick.outputs.sha != ''
    name: deploy ${{ needs.pick.outputs.sha }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      id-token: write
      contents: read
    env:
      SHA: ${{ needs.pick.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE }}
          aws-region: ${{ vars.AWS_REGION }}
      # What ECS runs (the service's PRIMARY deployment → task definition → the hub image's sha tag; ecs:DescribeServices
      # and ecs:DescribeTaskDefinition, sizeup-aws/2-iam.sh): this commit must be it or a descendant of it, by git
      # ancestry (the GitHub compare API). Fails closed when ECS or GitHub can't be read. Not for a deploy by hand.
      - name: Nothing newer is deployed
        if: github.event_name != 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/deploy_check.py pick --guard --repo "$GITHUB_REPOSITORY" --sha "$SHA" --cluster sizeup-hub --service sizeup-hub
      # Every SSM parameter the task definition names must exist before anything is built or ECS touched: a task whose
      # secret is missing never starts, and the service would roll to it. Names only (ssm:DescribeParameters: metadata,
      # never a value; sizeup-aws/23-deploy-ssm-describe.sh grants it).
      - name: Every secret the task definition names is in SSM
        shell: bash
        run: |
          err=$(mktemp)
          cant() {   # AWS refused or unreachable: say so, never "missing"
            c=$(grep -oE '\([A-Za-z]+(Exception|Error)?\)' "$err" | head -n1 | tr -d '()' || true)
            echo "::error title=Could not check SSM::could not check SSM: ${c:-$(head -n1 "$err" | cut -c1-200)} ($1); nothing was deployed"
            exit 1
          }
          acct=$(aws sts get-caller-identity --query Account --output text 2>"$err") || cant "sts get-caller-identity"
          names=$(python3 tools/taskdef_params.py deploy/aws/taskdef.json --region "$AWS_REGION" --account "$acct") || {
            echo "::error title=Task definition secrets::deploy/aws/taskdef.json: see the line above; nothing was deployed"
            exit 1
          }
          found=$(aws ssm describe-parameters \
            --parameter-filters "Key=Name,Option=Equals,Values=$(paste -sd, - <<<"$names")" \
            --query 'Parameters[].Name' --output text 2>"$err") || cant "ssm describe-parameters"
          missing=$(comm -23 <(sort -u <<<"$names") <(tr '\t' '\n' <<<"$found" | sort -u))
          if [ -n "$missing" ]; then
            for n in $missing; do
              echo "::error title=Missing SSM parameter::$n is named in deploy/aws/taskdef.json but not in SSM: create it (sizeup-aws) before deploying; nothing was deployed"
            done
            exit 1
          fi
          echo "All $(wc -l <<<"$names" | tr -d ' ') SSM parameters the task definition names exist."
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          provenance: false
          # the full git sha: /healthz and the station link report it, and stations follow it
          # (sizeup/cloud/autoupdate.py matches it against git)
          build-args: |
            SIZEUP_BUILD=${{ env.SHA }}
          tags: ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ env.SHA }}
      - id: td
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: deploy/aws/taskdef.json
          container-name: hub
          image: ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ env.SHA }}
      - id: td2
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ steps.td.outputs.task-definition }}
          container-name: cloudflared
          image: ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ env.SHA }}
      - id: svc
        run: echo "exists=$(aws ecs describe-services --cluster sizeup-hub --services sizeup-hub --query 'length(services[?status==`ACTIVE`])' --output text)" >> "$GITHUB_OUTPUT"
      - id: deploy
        name: Roll the ECS service   # this name: the next pick reads "deployed" from it (tools/deploy_check.py ROLL_STEP)
        if: steps.svc.outputs.exists == '1'
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.td2.outputs.task-definition }}
          cluster: sizeup-hub
          service: sizeup-hub
          wait-for-service-stability: true
      - if: steps.svc.outputs.exists != '1'
        run: |
          aws ecs register-task-definition --cli-input-json "file://${{ steps.td2.outputs.task-definition }}" >/dev/null
          echo "::notice::Task definition registered; the ECS service isn't created yet (sizeup-aws/9-service.sh)."
      # The replicas as the new leader verified them (2026-11-13: a corrupt cad.sqlite replica sat unnoticed for ~110 min,
      # until the next takeover failed). The hub checks them itself (sizeup/replicawatch.py, 2 min after it serves); this
      # reads ONLY its record, replica-watch.json: no database leaves AWS (the deploy role may GetObject that one key:
      # sizeup-aws/28-replica-watch.sh).
      - name: The new leader verified the replicas
        if: ${{ !cancelled() && steps.deploy.outcome == 'success' }}
        timeout-minutes: 12
        run: python3 tools/deploy_check.py replicas --build "$SHA" --timeout 600
      - name: Wait for the station to run this build
        if: ${{ !cancelled() && steps.deploy.outcome == 'success' }}
        timeout-minutes: 17
        env:
          SIZEUP_STATUS_TOKEN: ${{ secrets.SIZEUP_STATUS_TOKEN }}
          SIZEUP_ACCESS_CLIENT_ID: ${{ secrets.SIZEUP_ACCESS_CLIENT_ID }}
          SIZEUP_ACCESS_CLIENT_SECRET: ${{ secrets.SIZEUP_ACCESS_CLIENT_SECRET }}
          SIZEUP_HUB_URL: ${{ vars.SIZEUP_HUB_URL || 'https://sizeup.actualsecurity.org' }}
        run: |
          if [ -z "$SIZEUP_STATUS_TOKEN" ]; then
            echo "::warning title=Station check skipped::Add the SIZEUP_STATUS_TOKEN secret (and SIZEUP_ACCESS_CLIENT_ID / SIZEUP_ACCESS_CLIENT_SECRET) to check that the station follows: docs/cloud.md, Station health and alerts"
            exit 0
          fi
          python3 tools/deploy_check.py --url "$SIZEUP_HUB_URL" --build "$SHA" --timeout 900
