[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sizeup"
version = "0.0.1"
description = "Self-dispatch CAD and radio monitor for Port Chester FD (hub and station)"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
# docs: site documents (#459, sizeup/docfiles.py): pypdf checks and cleans a PDF, PDFium draws its page, Pillow a plan
# picture; the hub image installs it
docs = ["pypdfium2>=4.30,<6", "pypdf>=5,<8", "Pillow>=10"]
dev = ["pytest>=8", "pytest-xdist>=3.5", "pypdfium2>=4.30,<6", "pypdf>=5,<8", "Pillow>=10",
       "jsonschema>=4.20", "openapi-spec-validator>=0.7", "pyyaml>=6"]   # the last three: /api/v1's contract tests (#557)
# radio pre-alert inference on Amazon Bedrock (sizeup/intel/infer.py): the Anthropic SDK's Mantle client + boto3
intel-llm = ["anthropic[bedrock]==2.8.0"]

[tool.setuptools.packages.find]
include = ["sizeup*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# A test still running after 5 min: every thread's stack on stderr (an xdist worker's reaches the CI log), and it goes
# on (dump only, no exit). A stall then says where it is (#740: CI sat at 98% with no output until the job timeout).
faulthandler_timeout = 300
