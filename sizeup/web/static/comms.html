<!doctype html>
<html lang="en" class="cad">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PCFD Comms</title>
<link rel="icon" type="image/svg+xml" href="/static/brand/pcfd-mark.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/static/brand/pcfd-mark-32.png">
<link rel="stylesheet" href="/static/style.css">
<link rel="stylesheet" href="/static/cad.css">
</head>
<body class="cad comms">
<header>
  <a class="brand" href="/cad" title="Dispatch console"><img class="brand-mark" src="/static/brand/pcfd-mark.svg" alt="" width="28" height="28"><span class="brand-name">Port Chester FD</span></a>
  <span class="cad-title">Communications</span>
  <span id="station" class="station"></span>
  <span id="conn" class="pill warn">Connecting</span>
  <span id="talking" class="talking-strip" hidden aria-live="polite"></span>
  <span class="spacer"></span>
  <span id="alerts"></span>
  <a class="nav" href="/cad" title="Dispatch console" aria-label="CAD"><svg class="ico" aria-hidden="true"><use href="/static/icons.svg#i-dispatch"/></svg><span class="lbl">CAD</span></a>
  <a class="nav" href="/monitor" title="Radio monitor" aria-label="Monitor"><svg class="ico" aria-hidden="true"><use href="/static/icons.svg#i-monitor"/></svg><span class="lbl">Monitor</span></a>
</header>

<main class="comms-main">
  <form id="filters" class="comms-filters" autocomplete="off">
    <label>Unit <select id="f-unit"><option value="">Any unit</option></select></label>
    <label>Channel <select id="f-channel"><option value="">Any channel</option></select></label>
    <label>Event <select id="f-event"><option value="">Any event</option></select></label>
    <label>Show <select id="f-type">
      <option value="">All</option><option value="radio">Transmissions</option><option value="notes">Unit notes</option>
    </select></label>
    <label class="check"><input id="f-pcfd" type="checkbox"> <span>PCFD only</span></label>
    <label>From <input id="f-since" type="datetime-local"></label>
    <label>To <input id="f-until" type="datetime-local"></label>
    <button id="f-clear" type="button">Clear</button>
    <span class="spacer"></span>
    <span id="count" class="dim small"></span>
  </form>
  <ol id="rows" class="list log comms-list" aria-live="off"></ol>
</main>

<script src="/static/icons.js"></script>
<script src="/static/radio.js"></script>
<script src="/static/comms.js"></script>
</body>
</html>
