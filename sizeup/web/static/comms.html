<!doctype html>
<html lang="en" class="cad">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sizeup Comms</title>
<link rel="stylesheet" href="/static/style.css">
<link rel="stylesheet" href="/static/cad.css">
</head>
<body class="cad comms">
<header>
  <span id="station" class="station">sizeup</span>
  <span class="cad-title">Communications</span>
  <span id="conn" class="pill warn">connecting…</span>
  <span id="talking" class="talking-strip" hidden aria-live="polite"></span>
  <span class="spacer"></span>
  <span id="alerts"></span>
  <a class="nav" href="/cad" title="PCFD dispatch console">CAD →</a>
  <a class="nav" href="/monitor" title="The radio monitor (map, pages, traffic)">Monitor →</a>
</header>

<main class="comms-main">
  <form id="filters" class="comms-filters" autocomplete="off">
    <label>Unit <select id="f-unit"><option value="">Any unit</option></select></label>
    <label>Channel <select id="f-channel"><option value="">Any channel</option></select></label>
    <label>Event <select id="f-event"><option value="">Any event</option></select></label>
    <label>Show <select id="f-type">
      <option value="">Transmissions + unit notes</option><option value="radio">Transmissions</option><option value="notes">Unit notes</option>
    </select></label>
    <label class="check"><input id="f-pcfd" type="checkbox"> <span>PCFD units only</span></label>
    <label>From <input id="f-since" type="datetime-local"></label>
    <label>To <input id="f-until" type="datetime-local"></label>
    <button id="f-clear" type="button">Clear</button>
    <span class="spacer"></span>
    <span id="count" class="dim small"></span>
  </form>
  <ol id="rows" class="list log comms-list" aria-live="off"></ol>
</main>

<script src="/static/radio.js"></script>
<script src="/static/comms.js"></script>
</body>
</html>
