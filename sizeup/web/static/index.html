<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PCFD Monitor</title>
<link rel="icon" type="image/svg+xml" href="/static/brand/pcfd-mark.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/static/brand/pcfd-mark-32.png">
<link rel="stylesheet" href="/static/vendor/maplibre-gl.css">
<link rel="stylesheet" href="/static/style.css">
<link rel="stylesheet" href="/static/cadmap.css">
</head>
<body>
<header>
  <a class="brand" href="/cad" title="Dispatch console"><img class="brand-mark" src="/static/brand/pcfd-mark.svg" alt="" width="28" height="28"><span class="brand-name">Port Chester FD</span></a>
  <span class="cad-title">Monitor</span>
  <span id="station" class="station"></span>
  <span id="conn" class="pill warn">Connecting</span>
  <span id="radios" class="radios"></span>
  <span id="sdr" class="sdrs" hidden></span>
  <button id="live" class="live-btn" title="Play each new transmission and page as it comes in">Live</button>
  <span id="talking" class="talking-strip" hidden aria-live="polite"></span>
  <span class="spacer"></span>
  <span id="storage" class="storage dim" hidden></span>
  <span id="alerts"></span>
  <a class="nav" href="/comms" title="All transmissions" aria-label="Comms"><svg class="ico" aria-hidden="true"><use href="/static/icons.svg#i-radio"/></svg><span class="lbl">Comms</span></a>
  <a class="nav" href="/cad" title="Dispatch console" aria-label="CAD"><svg class="ico" aria-hidden="true"><use href="/static/icons.svg#i-dispatch"/></svg><span class="lbl">CAD</span></a>
  <a class="nav" href="/cad#settings" aria-label="Settings"><svg class="ico" aria-hidden="true"><use href="/static/icons.svg#i-settings"/></svg><span class="lbl">Settings</span></a>
  <span id="clock" class="clock"><span id="clock-date" class="dim"></span> <b id="clock-local"></b> <span id="clock-z" class="dim"></span></span>
</header>

<main>
  <section class="stage">
    <div id="map"></div>
    <div class="controls">
      <button id="zoom-in" title="Zoom in (+)">+</button>
      <button id="zoom-out" title="Zoom out (−)">−</button>
      <button id="recenter" title="Recenter (c)" aria-label="Recenter"><svg class="ico" aria-hidden="true"><use href="/static/icons.svg#i-locate"/></svg></button>
    </div>
  </section>

  <aside id="panel">
    <section id="incident" class="incident none">
      <div class="inc-head">
        <h2>Incident</h2>
        <span id="inc-status" class="inc-status"></span>
        <span class="spacer"></span>
        <button id="inc-close" class="inc-close" hidden>Close</button>
      </div>
      <div id="inc-empty" class="inc-empty">
        <div class="big dim">No incident</div>
        <div id="inc-listening" class="dim"></div>
      </div>
      <div id="inc-body" hidden>
        <div id="inc-type" class="inc-type"></div>
        <div id="inc-addr" class="inc-addr"></div>
        <div id="inc-geo-note" class="inc-note" hidden></div>
        <div id="inc-cross" class="inc-cross"></div>
        <div class="inc-facts">
          <span><span class="dim">Time out</span> <b id="inc-timeout"></b></span>
          <span><span class="dim">Elapsed</span> <b id="inc-elapsed"></b></span>
        </div>
        <div id="inc-depts" class="chips"></div>
      </div>
    </section>

    <section id="dispatch-section" class="dispatch-section" hidden>
      <h2>Dispatch</h2>
      <ol id="dispatch" class="list dispatch"></ol>
    </section>

    <section class="grow">
      <div class="sec-head">
        <h2 id="traffic-title">Radio traffic</h2>
        <span class="spacer"></span>
        <span id="rerun-msg" class="dim rerun-msg"></span>
        <button id="rerun-all" class="tg-open" title="Re-transcribe every recording still on disk">Re-run all</button>
      </div>
      <ol id="traffic" class="list log"></ol>
    </section>

    <section id="other-section" class="other-section">
      <div class="sec-head">
        <button id="other-toggle" class="sec-toggle" aria-expanded="false" aria-controls="other"
                title="Talkgroups not marked Main">
          <span class="caret" aria-hidden="true">▸</span><span class="h2">Other TGs</span>
          <span id="other-sum" class="dim sum"></span>
        </button>
        <button id="tg-open" class="tg-open" title="Which talkgroups are recorded and which are Main">Talkgroups</button>
      </div>
      <ol id="other" class="list other" hidden></ol>
    </section>

    <section class="pages-section">
      <h2>Pages</h2>
      <ol id="pages" class="list pages"></ol>
    </section>

    <section class="history-section">
      <h2>Earlier</h2>
      <ol id="history" class="list history"></ol>
    </section>
  </aside>
</main>

<div id="tg-overlay" class="overlay" hidden>
  <div class="tg-panel" role="dialog" aria-modal="true" aria-labelledby="tg-title">
    <div class="tg-head">
      <h2 id="tg-title" class="tg-title">Talkgroups</h2>
      <span id="tg-sum" class="dim tg-sum"></span>
      <span class="spacer"></span>
      <button id="tg-close" class="tg-close" title="Close (Esc)" aria-label="Close"><svg class="ico" aria-hidden="true"><use href="/static/icons.svg#i-x"/></svg></button>
    </div>
    <div class="tg-tools">
      <input id="tg-filter" class="tg-filter" type="search" placeholder="Filter"
             autocomplete="off" spellcheck="false" aria-label="Filter talkgroups">
      <button type="button" class="help" aria-label="Help" aria-expanded="false" data-help="Record: keeps its calls and transcribes them.
Main: puts them in Radio traffic and on our incident.">?</button>
    </div>
    <div id="tg-error" class="tg-error" hidden></div>
    <div id="tg-groups" class="tg-groups"></div>
  </div>
</div>

<script src="/static/vendor/maplibre-gl.js"></script>
<script src="/static/map-style.js"></script>
<script src="/static/icons.js"></script>
<script src="/static/help.js"></script>
<script src="/static/radio.js"></script>
<script src="/static/live.js"></script>
<script src="/static/cadmap.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
