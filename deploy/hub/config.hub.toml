# sizeup HUB: the web UI and the CAD in the cloud, fed by the station (docs/cloud.md).
# Baked into the image; no secrets here. Environment overrides (sizeup/config.py):
#   SIZEUP_STATION_TOKEN   the station's bearer token (required: without it the hub refuses the station)
#   SIZEUP_STATE_DIR       where cad.sqlite, hub.sqlite and audio.sqlite go (the image sets /data)
#   SIZEUP_PORT, SIZEUP_HOST, SIZEUP_PUBLIC_URL
#   SIZEUP_ACCESS_TEAM, SIZEUP_ACCESS_AUD   Cloudflare Access identity (below)
#   SIZEUP_511NY_KEY       the 511NY feeds' key (SSM /sizeup-hub/511ny-key; [roads] below)
#   SIZEUP_MTA_KEY         only should the MTA require a key again (SSM /sizeup-hub/mta-key; [trains]: none needed today)
#   SIZEUP_ALERT_TOPIC     the alarms' pushes (emergency, mayday, aircraft): our own ntfy topic (SSM /sizeup-hub/alert-topic)
#   SIZEUP_STATUS_TOPIC    station health / Amazon Transcribe pushes: our own ntfy topic (SSM /sizeup-hub/status-topic)
# Run it on a Mac or Linux box without radios:
#   SIZEUP_STATE_DIR=$(mktemp -d) SIZEUP_STATION_TOKEN=... python -m sizeup --config deploy/hub/config.hub.toml

[cloud]
role = "hub"
public_url = ""                    # e.g. "https://sizeup.example.org" (or SIZEUP_PUBLIC_URL); shown in /healthz
offline_after_s = 15               # no word from the station this long = "Station offline" on screen
audio_max_mb = 500                 # received clips kept in audio.sqlite (oldest dropped first)
# Cloudflare Access identity (sizeup/cloud/access.py, docs/cloud.md "Who is signed in"): with both set,
# every page and API but /healthz and /api/station/ needs a verified Access token, and the email
# someone signed in with is the operator (named in Settings > Users). Either empty: off (free-text
# Operator field), said in the log. Neither is a secret.
access_team = "yoda.cloudflareaccess.com"
# The "sizeup" Access application's Application Audience (AUD) Tag: Zero Trust → Access controls →
# Applications → sizeup → Overview. 64 hex digits; or SIZEUP_ACCESS_AUD.
access_aud = "12529a64fd59333b30c2b9c681726f2c15339084be03f4d5c7f8ac4b72cdf736"

[station]
id = "pcfd-hub"
name = "Port Chester FD"

[web]
host = "127.0.0.1"                 # cloudflared runs beside it (same Fargate task / compose network namespace)
port = 8090

[radio]
# Nothing is ever opened on the hub. The channels are listed for their labels and kinds only (the
# CAD links unidentified traffic on the "traffic" ones to the active call): keep them the station's.
sdrs = []

[[radio.channels]]
label = "South 2"
mhz = 470.2
kind = "paging"

[[radio.channels]]
label = "FG1"
mhz = 453.0375
kind = "traffic"

[[radio.channels]]
label = "FG2"
mhz = 458.0375
kind = "traffic"

[p25]
capture_dir = ""                   # no trunk-recorder here: the station sends its calls
talkgroups_file = "../trunk-recorder/talkgroups.csv"   # names for the talkgroups the station reports
incident_talkgroups = [307, 333]

[stt]
# Amazon Transcribe streaming for the channels set to AWS in Settings > Radios (sizeup/transcribe.py).
# Credentials: the task role (sizeup-aws/12-transcribe.sh adds transcribe:StartStreamTranscription*
# and the sizeup-* vocabularies); region: the task's AWS_REGION. No whisper here: the station runs it.
aws = true
aws_channels = ["South 2", "FG1", "FG2", 307]   # South 2 paging, FG1, FG2, Fire/EMS 15 default to AWS
# Recorded, not transcribed, unless Settings > Radios > Channels says otherwise (#201): WCPD Ch 1 (383) and
# LLT Supervisor 1 (3127), about 1,800 clips a day off the station's whisper. The hub folds this into the
# channel choices it sends the station (sizeup/channels.py for_station()).
record_only = [383, 3127]
aws_monthly_limit_usd = 25               # Settings > Radios can change it; reached: whisper on the station
aws_idle_s = 120

[storage]
keep_hours = 24                    # pages, monitor incidents, transcripts (the CAD keeps its own records)
audio_keep_hours = 12              # received clips

[cad]
db = "cad.sqlite"                  # under SIZEUP_STATE_DIR: the CAD of record
department = "Port Chester Fire"
monitor_departments = ["Port Chester FD", "Rye Brook FD"]

[dispatch]
# The voice is made here, by Amazon Polly (sizeup/polly.py; the task role needs polly:SynthesizeSpeech,
# sizeup-aws/11-polly.sh). Region: AWS_REGION from the task (polly_region overrides). If Polly fails,
# the station renders it (its Kokoro, a man's voice: am_michael); no station either: text only, said so.
tones = [[903.2, 1.0], [810.2, 3.0]]  # Port Chester Fire, heard on air (60 Control tone tests 10-20 and 10-23-2026, #47)
tts_engine = "polly"
voice = "Matthew"                  # US English men: Matthew, Stephen, Gregory, Joey (generative, else neural)
speed = 0.92                       # said as SSML <prosody rate="92%">; 1.0 = Polly's own pace
fallback_voice = "Samantha"        # the station's macOS `say` voice, if its Kokoro is down too
repeat = 2
transmit = false                   # transmission stays on the station (M2): the hub sends it this WAV to play
channels = ["FG1", "PC repeater"]

[prealert]
# The phone pre-alert from Tapout (docs/cloud.md, config.example.toml): the hub is the CAD of record,
# so it subscribes, read only. NEVER publish to these topics: pcfd-phone-prealert pages the fire crew.
enabled = true
server = "https://ntfy.sh"           # SIZEUP_PREALERT_SERVER overrides (tests: a local fake)
ring_topic = "pcfd-phone-prealert"
status_topic = "pcfd-status"
expire_min = 5
heartbeat_stale_min = 90

[roads]
# The maps' highway layers (sizeup/roads.py, docs/cloud.md "Highway layers"). thruway: the NYS Thruway
# Authority's public feeds (cameras, incidents, signs on I-95 and I-287; no key). 511NY: off until it
# approves access (https://511ny.org/help/24) and the key is in SSM /sizeup-hub/511ny-key
# (SIZEUP_511NY_KEY in deploy/aws/taskdef.json); then the feed addresses from the approval go here,
# {key} where the key goes (never the key itself). Mileposts and exits work without either.
thruway = true
county = true                           # Westchester County DPW's cameras (no key)
# events_url = ""
# cameras_url = ""
# signs_url = ""
bbox = [-73.80, 40.92, -73.56, 41.10]   # west, south, east, north: Port Chester, Rye Brook, the neighbours, Greenwich

# [gis]: the maps' County GIS layers (sizeup/gis.py, docs/cloud.md "County GIS layers"): the starter set
# from Westchester County GIS, fetched here on its schedule, cached under /data/gis. No key. Nothing to set.

# [alerts]: station health (sizeup/cloud/health.py, docs/cloud.md "Station health and alerts"): banner on /cad
# and /monitor, the log, and a push to our OWN status topic: env SIZEUP_STATUS_TOPIC (SSM /sizeup-hub/status-topic;
# the alarms go to SIZEUP_ALERT_TOPIC, SSM /sizeup-hub/alert-topic; only one set: everything goes there), never in
# this file (ntfy topics are public by name). Never Tapout's pcfd-phone-prealert / pcfd-status (refused). No topic:
# no push. The thresholds below are the defaults.
[alerts]
silent_min = 3                     # no state post from the station this long
behind_min = 15                    # on another build than the hub this long
down_min = 2                       # whisper or trunk-recorder down this long
outbox_min = 5                     # the oldest event waiting on the station this old
disk_pct = 90                      # the station's disk this full
repeat_min = 15                    # at most one push per alert this often (plus its recovery)
