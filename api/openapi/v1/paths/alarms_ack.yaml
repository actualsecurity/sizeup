post:
  operationId: acknowledgeAlarm
  summary: Acknowledge an alarm
  description: >
    The console's own acknowledge, as the signed-in person: dispatchers and admins. Needs the `writes` feature. An alarm
    somebody already acknowledged is a 409 `already_acknowledged` with the alarm as it is.
  parameters:
    - $ref: ../parameters/IdempotencyKey.yaml
    - {name: id, in: path, required: true, schema: {type: string}}
  requestBody:
    required: false
    content:
      application/json:
        schema: {$ref: ../schemas/AckRequest.yaml}
        example: {client_at: 1767225590.2}
  responses:
    "200":
      description: Acknowledged (or the first answer, replayed).
      headers:
        Idempotent-Replayed:
          description: "true when this is the first answer replayed for a retried Idempotency-Key."
          schema: {type: string, enum: ["true"]}
      content:
        application/json:
          schema:
            allOf:
              - {$ref: ../schemas/ClientAt.yaml}
              - type: object
                required: [alarm]
                properties: {alarm: {$ref: ../schemas/Alarm.yaml}}
          example:
            alarm: {$ref: ../examples/Alarm.yaml}
    "409":
      description: Not applied (already_acknowledged, in_progress). `current` is the alarm as it is now.
      headers:
        Retry-After:
          description: Seconds to wait (only for in_progress).
          schema: {type: integer}
      content: {application/json: {schema: {$ref: ../schemas/WriteError.yaml}}}
    "422":
      description: The Idempotency-Key was used for another request.
      content: {application/json: {schema: {$ref: ../schemas/Error.yaml}}}
    default:
      description: >
        An error: 400 (invalid, bad `client_at`, idempotency_key_required, invalid_idempotency_key), 401, 403 forbidden,
        404 no_such_alarm, 408 request_timeout, 411 length_required, 413 body_too_large, 429, 503.
      headers:
        Retry-After:
          description: Seconds to wait (429, 503).
          schema: {type: integer}
      content: {application/json: {schema: {$ref: ../schemas/Error.yaml}}}
