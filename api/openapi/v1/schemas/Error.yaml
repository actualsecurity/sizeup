type: object
required: [error]
properties:
  error:
    type: object
    required: [code, message]
    properties:
      code:
        type: string
        description: A machine code, stable. A code the app does not know is handled by the status.
      message:
        type: string
        description: Human text.
      retry_after_s:
        type: integer
        description: Try again after this many seconds (also the Retry-After header).
