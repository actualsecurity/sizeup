type: object
required: [id, number, status, closed_at, disposition, rev]
description: An incident as a 409 shows it (`current`): its state, not its content. `rev` as for Unit.
properties:
  id: {type: integer}
  number: {type: string}
  status: {type: string, description: "queued, pending, active, closed or dismissed (an unknown value is other)."}
  closed_at: {type: [number, "null"]}
  disposition: {type: string}
  rev: {type: string}
