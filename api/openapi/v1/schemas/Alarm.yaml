type: object
description: >
  An emergency alarm or notice (an emergency button, a mayday heard, an aircraft emergency). `who` is the talker as the
  console labels it; no separate radio ID is sent.
required: [id, state, level, what, who, rev]
properties:
  id: {type: string}
  state: {type: string, description: "open (not acknowledged) | notice | recent (just acknowledged)."}
  level: {type: string, description: "alarm | notice."}
  at: {type: [number, "null"]}
  created_at: {type: [number, "null"]}
  what: {type: string}
  who: {type: string}
  channel: {type: string}
  text: {type: string}
  emergency: {type: boolean}
  drill: {type: boolean}
  source: {type: string}
  subject: {type: string}
  incident_id: {type: [string, "null"]}
  incident_number: {type: [string, "null"]}
  has_clip: {type: boolean}
  quiet: {type: boolean, description: "Someone else's emergency on a service the department does not list: no toast."}
  ack_by: {type: string}
  ack_at: {type: [number, "null"]}
  clear_by: {type: string}
  clear_at: {type: [number, "null"]}
  rev:
    $ref: ./Rev.yaml
