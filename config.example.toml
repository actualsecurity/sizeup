# sizeup station config. Copy to config.toml (gitignored) and edit. Unknown keys are rejected.

[station]
id = "pcfd-hq"
name = "Port Chester FD Headquarters"

[web]
host = "127.0.0.1"                 # 0.0.0.0 to serve the firehouse LAN
port = 8090

[radio]
rtl_fm = "rtl_fm"                  # the RTL-SDR Blog build for a V4
# Dongles switched in the web app: "auto" = every RTL-SDR plugged in gets a row of switches (a
# channel, Fire/EMS 15 via trunk-recorder, or Off); rows come and go as dongles are plugged in or
# out. Or list exact serials to show only those. Each is looked up by serial right before every
# start and passed as an index (all-digit serials are read as indexes). sdr_ignore = serials never
# shown or used.
sdrs = "auto"
sdr_names = { v4 = "V4" }           # optional: name shown in the web app per serial
sdr_ignore = []
start_mode = "South 2"            # first listed SDR at a fresh start; after that the web app's choice is kept
# A dongle that shows up (at startup, or plugged in while running) with no job a person picked gets
# the first job in auto_assign_order that no plugged-in dongle has (an unplugged dongle's job is
# free: a replacement takes it); all covered = it stays Off. Never a dongle another app holds
# (shortfinal, ~/.local/state/rtl-claims), never over a person's choice (Off included), and running
# dongles are never moved. Shown as "FG1 · auto" in the web app. deploy/station/README.md has the rules.
# Jobs: channel labels (any case/spacing: "fg1", "south2") or "p25" (Fire/EMS 15, trunk-recorder:
# one dongle covers the county system's control and voice channels). false = new dongles start Off
# and sizeup never opens one until you pick a mode for it.
auto_assign = true
auto_assign_order = ["fg1", "p25", "south2"]

# One rtl_fm per channel, one dongle each (serials set with `rtl_eeprom -s <serial>`).
[[radio.channels]]
label = "South 2"                  # 60 Control fire paging, South Zone simulcast
mhz = 470.2
kind = "paging"                    # tones -> pages -> incidents
device = "fire-page"
gain_db = 40
squelch_db = 10                    # FM quieting (dB below the idle hiss) needed to open
# hang_s = 1.5                     # paging: once a page has had tones or speech, it stays open this long
#                                  # through a fade (traffic: 0.4 s, unchanged)
# continue_s = 3                   # paging: the carrier back within this long after a page closed (even
#                                  # under squelch_db) is more of the same page; it's sent on after this

[[radio.channels]]
label = "FG1"                      # PCFD / Rye Brook primary fireground (county list 2024-11-06)
mhz = 453.0375
kind = "traffic"                   # transcribed and attached to the active incident
device = "fire-fg"
gain_db = 40
drop_db = 10                       # end a transmission when quieting falls this far under its own
                                   # level (another, weaker carrier on the channel); 0 = off.
                                   # Default 10 for traffic channels, off for paging.

# Two-tone codes. UNVERIFIED until heard on the air: every decoded pair is shown with its page
# so the real codes can be confirmed and named here. `ours = true` = opens incidents.
[[tones]]
name = "Port Chester FD"
a_hz = 349.1                       # RadioReference wiki (2025-07), unverified
b_hz = 311.1
agency = "PCFD"
ours = true

[stt]
server_binary = "whisper-server"   # whisper.cpp server; the model stays loaded
model = "models/ggml-large-v3-turbo.bin"
port = 8179
threads = 8
beam_size = 0                      # whisper beam search width (0 = greedy). 5 = fewer garbled digit strings, ~10% slower
prompt = ""                        # optional vocabulary hint (can make the model insert words: off by default)
talker_prompt = "off"              # "ids": hint each call with who keyed up ("77 Alpha 4, 60 Control"); "ids+time": also its HHMM
# Amazon Transcribe streaming (docs/cloud.md "Speech-to-text per channel"). It runs on the hub
# (deploy/hub/config.hub.toml: aws = true); a station forwarding to the hub needs nothing here.
# All-in-one with AWS credentials in the environment could set aws = true too.
# aws = false
# aws_region = ""                  # "" = AWS_REGION / AWS_DEFAULT_REGION, else us-east-1
# aws_channels = ["South 2", "FG1", 307]   # engine "aws" by default; Settings > Radios changes any channel
# aws_monthly_limit_usd = 25       # until Settings > Radios sets one; reached: AWS channels use whisper
# aws_idle_s = 120                 # a channel's stream ends this long after its last transmission
# aws_pace = 2.0                   # audio sent this many times faster than real time
# aws_vocabulary = "sizeup-pcfd"   # the custom vocabulary (Settings > Radios > Vocabulary, Push)
# aws_endpoint = ""                # tests / dev only: a local fake (ws://127.0.0.1:9431)
# aws_api_endpoint = ""            # tests / dev only: a local fake of the JSON API (http://127.0.0.1:9432)

[p25]
# trunk-recorder capture directory (Westchester County P25, South simulcast site). Empty = no P25.
capture_dir = "captures/p25"            # where trunk-recorder writes calls
recorder = "~/.local/src/trunk-recorder/build/trunk-recorder --config=config.json"
recorder_dir = "deploy/trunk-recorder"  # its config.json + talkgroups.csv
talkgroups_file = "deploy/trunk-recorder/talkgroups.csv"   # names for all recorded talkgroups
incident_talkgroups = [307, 333]   # Fire/EMS 15 (Battalion 15) + Airport Incident attach to our incident
aliases = {}                       # radio ID -> unit name, e.g. { "2391001" = "2391" }

[mdc]
# MDC-1200 PTT-ID (Motorola radios send it on key-up/release): radio ID -> unit name shown on traffic.
aliases = {}                       # e.g. { "0611" = "Engine 60" }

[units]
# Apparatus -> department, from the county mutual aid plan roster (2021; data/westchester_apparatus.csv).
# A page naming one of our units opens an incident even when its tones aren't known yet.
apparatus_file = "data/westchester_apparatus.csv"
departments = {}                   # overrides / additions, e.g. { "Engine 65" = "Port Chester FD" }
# Chief officers by callsign (dept number 239 + rank digit). Shown on P25 talkers ("2398 Duty Officer")
# and matched in pages, which then count as Port Chester.
callsigns = { "2391" = "Chief of Department", "2392" = "1st Assistant Chief", "2393" = "2nd Assistant Chief", "2395" = "Immediate Past Chief", "2398" = "Duty Officer" }

[storage]
clips_dir = "captures/clips"
keep_hours = 24                    # pages, incidents, transcripts
audio_keep_hours = 12              # every WAV under captures/ (clips, skipped clicks, P25 calls); cleaner runs every 10 min

[map]
home_lon = -73.6640
home_lat = 41.0130
home_zoom = 13.4

[cad]
# PCFD self-dispatch console (/cad). Incidents, units, run cards and the dispatch log live in one
# SQLite file, outside captures/ (whose cleaner deletes old files).
db = "state/cad.sqlite"
department = "Port Chester Fire"   # first words of every dispatch, as said on the air
# Event types, subtypes, dispositions, unit statuses, the two unit boards, colors and the dispatch
# wording, from the department's sheet ("[TEMPLATE] PCFD ECC OPS"). Replace the file to change them.
lists = "data/cad_lists.json"
monitor_departments = ["Port Chester FD", "Rye Brook FD"]   # their tones, or an address in their town -> an event to accept

[dispatch]
# Alert tones before the voice: [hz, seconds] in order (two-tone sequential). UNVERIFIED placeholder:
# the Port Chester FD pair from data/westchester_tones.csv (RadioReference wiki, not yet heard on the
# air). Set to the tones PCFD members' pagers/radios actually alert on before transmit is ever enabled.
tones = [[349.1, 1.0], [311.1, 3.0]]
# The voice: Kokoro-82M, a local neural text-to-speech model, run by sizeup on 127.0.0.1:tts_port (CPU).
# Set it up once with tools/setup_tts.sh (~1.3 GB in ~/.local/share/sizeup/tts). While its server is
# down, erroring or slower than 10 s, dispatches use macOS `say` with fallback_voice (noted on each one).
# tts_engine = "polly": Amazon Polly over the internet (the hub's choice, deploy/hub/config.hub.toml):
# needs AWS credentials (AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY, or the ECS task role) allowed
# polly:SynthesizeSpeech; voice = "Matthew" (default), "Stephen", "Gregory", "Joey" (men) or "Joanna",
# "Ruth", "Danielle"; best engine first (generative, neural, standard); speed is said as SSML prosody.
# polly_region = "us-east-1"       # default: AWS_REGION / AWS_DEFAULT_REGION, else us-east-1
tts_engine = "kokoro"              # "kokoro" | "polly" | "say" (macOS `say` only, with `voice` a `say -v` voice) |
                                   # "none" (no voice here: a Linux station whose hub speaks with Polly; text only locally)
voice = "af_heart"                 # Kokoro voice: af_/am_ American, bf_/bm_ British (GET /api/cad/tts/voices)
speed = 0.92                       # Kokoro / Polly speaking speed, 0.5-2.0 (1.0 = the voice's own pace)
tts_port = 8093
fallback_voice = "Samantha"        # macOS `say -v` voice (`say -v '?'` lists them)
# tts_python = "~/.local/share/sizeup/tts/venv/bin/python"   # the default
rate = 0                           # `say` words per minute (0 = the voice's own pace)
repeat = 2                         # the voice part read this many times
# Transmit stays OFF in this version: there is no radio interface yet (M2: a sound-card + PTT
# interface into a PCFD radio, with the department's authorization). "Dispatch" logs what would
# have gone out and plays it in the browser. true is refused at startup.
transmit = false
channels = ["FG1", "PC repeater"]  # labels on the dispatch log only (FG1, or the PC repeater as PCFD's paging channel)

# [cloud]: run the CAD in the cloud for people away from this machine (docs/cloud.md). Leave it out
# for today's all-in-one. This machine (with the SDRs, whisper and the voice) is then the "station":
# it runs everything as before and forwards what it hears to the hub over outbound HTTPS only.
# The hub's own config is deploy/hub/config.hub.toml. Forwarding is switched on and off in the CAD,
# Settings > System > Station (kept in state/cloud.json, which then wins over role / hub_url here);
# secrets from the environment, this section, or the macOS Keychain (deploy/station/README.md).
# [cloud]
# role = "station"                   # the default until the switch is first used; leave out: off
# hub_url = "https://sizeup.example.org"   # the hub (behind Cloudflare Access: see docs/cloud.md)
# token = ""                         # the station's bearer token; better: env SIZEUP_STATION_TOKEN (same on the hub)
# access_client_id = ""              # Cloudflare Access service token for /api/station/* (or env
# access_client_secret = ""          #   SIZEUP_ACCESS_CLIENT_ID / SIZEUP_ACCESS_CLIENT_SECRET); "" = not used
# outbox = "state/outbox.sqlite"     # everything for the hub waits here while it's unreachable
# outbox_max_mb = 300                # queued audio over this: the oldest clips are dropped (never the transcripts)
# keychain_prefix = "sizeup"         # Keychain services sizeup-station-token, sizeup-access-id, sizeup-access-secret
#                                    #   (or keychain_token / keychain_access_id / keychain_access_secret)

# [prealert]: the phone pre-alert. Tapout (an ESP32 on the PCFD headquarters phone line, repo
# firehouse-ring-alerter) posts to ntfy.sh when the station's phone rings; the CAD shows each ring
# at the top of its 60 Control column as a possible incoming call, until a 60 Control page for Port
# Chester or a new emergency event matches it, someone dismisses it, or expire_min passes. Tapout's
# status topic (hourly heartbeat, restarts, warnings) shows as "Tapout: ok, heartbeat 12 min ago".
# READ ONLY: sizeup only subscribes (GET). NEVER publish to these topics, from sizeup or by hand to
# "test" it: pcfd-phone-prealert is the fire crew's real alert channel and pages their phones.
# Runs on the CAD of record only: all-in-one, or the hub. While this station forwards to a hub it
# doesn't subscribe (the hub does; two would double-alert). Leave the section out to turn it off.
[prealert]
enabled = true
server = "https://ntfy.sh"           # or env SIZEUP_PREALERT_SERVER (a local test server)
ring_topic = "pcfd-phone-prealert"   # real rings only (Tapout's ntfy_call)
status_topic = "pcfd-status"         # boot, hourly heartbeat, errors, OTA (Tapout's ntfy_status)
expire_min = 5                       # an unanswered pre-alert ends after this long
heartbeat_stale_min = 90             # no heartbeat (or restart) this long: "Tapout: no heartbeat for ..." in warning

# [roads]: the CAD maps' highway layers (sizeup/roads.py, docs/cloud.md "Highway layers"): traffic
# cameras, incidents and closures, roadwork and message signs for our area, from the NYS Thruway
# Authority's public feeds (I-95, I-287; no key; on by default) and from 511NY once it approves
# access (https://511ny.org/help/24: the approval brings the feed addresses and a key; the key: env
# SIZEUP_511NY_KEY, never here; the addresses have {key} where it goes). Camera snapshots go through
# this process, never from the browser to a provider. The mileposts and exits are the gazetteer's.
# [roads]
# thruway = true
# county = true                          # Westchester County DPW's cameras (no key)
# events_url = "https://.../events?key={key}&format=json"
# cameras_url = "https://.../cameras?key={key}"
# signs_url = "https://.../messagesigns?key={key}&format=json"
# bbox = [-73.80, 40.92, -73.56, 41.10]   # west, south, east, north: Port Chester, Rye Brook, neighbours
# events_every_s = 90                     # at least 60 (511NY: 10 calls a minute per key)
# signs_every_min = 5                     # at least 1
# cameras_every_min = 60                  # at least 10
# stream_max = 8                          # live camera streams through the hub at once (a camera watched by several
#                                         # pages is one); each ~26 KB/s and ~1.4 % of a core: 8 is safe on 0.25 vCPU
# wall_streams = 0                        # the camera wall's live tiles per page; 0: every streaming camera in our area

# [gis]: the CAD maps' "County GIS" layers (sizeup/gis.py, docs/cloud.md "County GIS layers"): Westchester
# County GIS open data (tax parcels, fire and EMS districts, hydrants, buildings, flood plains, rail ...),
# fetched by the hub (or all-in-one) from the county's ArcGIS REST services on a slow schedule, cached
# under the state dir (gis/<key>.geojson) and served to the browsers from here; the starter set is
# sizeup/gis.py DEFAULT_LAYERS, each with its terms. No key needed. Leave the section out: the starter
# set as is. One [[gis.layers]] entry with a starter key changes that entry; a new key adds a dataset.
# [gis]
# enabled = true
# bbox = [-73.80, 40.92, -73.56, 41.10]   # west, south, east, north: the area kept, unless a layer has its own
# [[gis.layers]]
# key = "parcels"                         # a starter entry: only what is set here changes
# on = true                               # on for a viewer who hasn't chosen
# [[gis.layers]]
# key = "zoning"                          # a new dataset: one entry, no code
# label = "Zoning districts"
# group = "Boundaries"                    # the sub-heading in the Layers box
# url = "https://giswww.westchestergov.com/arcgis/rest/services/DataHub_EnvironmentandPlanning/MapServer/207"
# fields = [["ZONING", "Zone"], ["ZONE_NAME", "Name"], ["MAX_HGHT", "Max height"], ["STORIES", "Storeys"]]   # shown on a click, first = title
# style = { color = "--warn", fill = 0.08, width = 1 }   # a design token or "#hex"; fill (opacity), width, radius, dash, label, labelzoom
# icon = "hydrant"                       # a point layer's mark (static/icons.svg i-gis-<icon>: hydrant, fire-station, police,
                                        # hospital, nursing-home, school, worship, ambulance, train, bus, petroleum, tank); none: a dot
# sub = "Petroleum bulk storage (NYSDEC PBS)"   # under a feature's title in the click box (none: the label)
# minzoom = 13                            # drawn from this zoom ("zoom in" below it)
# refresh = "monthly"                     # hourly | daily | weekly | monthly
# tiled = false                           # true: served by viewport (a big layer: the parcels, the buildings)
# simplify_m = 1.0                        # Douglas-Peucker tolerance in metres (0: as drawn)
# where = "MUN = 'Port Chester'"          # an extra SQL filter; bbox = [...] its own box
# licence = "Westchester County GIS disclaimer: public, as is"   # recorded here and in docs/cloud.md
# page = "https://gis.westchestercountyny.gov/datasets/<item>_207"
