# sizeup station config. Copy to config.toml (gitignored) and edit. Unknown keys are rejected.

[station]
id = "pcfd-hq"                     # the hub keys this station's token, history and outbox on it: never change it
name = "Port Chester FD South End"  # shown in Settings, health and alerts
# Where the station PC and its antennas are: the South End firehouse, 51-53 Grace Church St (#271), not HQ. Our ADS-B
# receiver's position (readsb --lat/--lon). Leave out for these defaults.
lat = 40.99600
lon = -73.66453

[web]
host = "127.0.0.1"                 # 0.0.0.0 to serve the firehouse LAN
port = 8090

[radio]
rtl_fm = "rtl_fm"                  # the RTL-SDR Blog build for a V4
# Dongles switched in the web app: "auto" = every RTL-SDR plugged in gets a row of switches (a
# channel, Fire/EMS 15 via trunk-recorder, or Off); rows come and go as dongles are plugged in or
# out. Or list exact serials to show only those. Each is looked up by serial right before every
# start and passed as an index (all-digit serials are read as indexes). sdr_ignore = serials never
# shown or used.
sdrs = "auto"
sdr_names = { v4 = "V4" }           # optional: name shown in the web app per serial
sdr_ignore = []
start_mode = "South 2"            # first listed SDR at a fresh start; after that the web app's choice is kept
# A dongle that shows up (at startup, or plugged in while running) with no job a person picked gets
# the first job in auto_assign_order that no plugged-in dongle has (an unplugged dongle's job is
# free: a replacement takes it); all covered = it stays Off. Never a dongle another app holds
# (shortfinal, ~/.local/state/rtl-claims), never over a person's choice (Off included), and running
# dongles are never moved. Shown as "FG1 · auto" in the web app. deploy/station/README.md has the rules.
# Jobs: channel labels (any case/spacing: "fg1", "south2") or "p25" (Fire/EMS 15, trunk-recorder:
# one dongle covers the county system's control and voice channels). FG2, then HPN Tower come last:
# only a 4th / 5th free dongle takes them by themselves, else pick them by hand. false = new dongles
# start Off and sizeup never opens one until you pick a mode for it.
auto_assign = true
auto_assign_order = ["fg1", "p25", "south2", "fg2", "hpn tower"]

# One rtl_fm per channel, one dongle each (serials set with `rtl_eeprom -s <serial>`).
[[radio.channels]]
label = "South 2"                  # 60 Control fire paging, South Zone simulcast
mhz = 470.2
kind = "paging"                    # tones -> pages -> incidents
device = "fire-page"
gain_db = 40
squelch_db = 10                    # FM quieting (dB below the idle hiss) needed to open
# hang_s = 1.5                     # paging: once a page has had tones or speech, it stays open this long
#                                  # through a fade (traffic: 0.4 s, unchanged)
# continue_s = 3                   # paging: the carrier back within this long after a page closed (even
#                                  # under squelch_db) is more of the same page; it's sent on after this

[[radio.channels]]
label = "FG1"                      # PCFD / Rye Brook primary fireground (county list 2024-11-06)
mhz = 453.0375
kind = "traffic"                   # transcribed and attached to the active incident
device = "fire-fg"
gain_db = 40
drop_db = 10                       # end a transmission when quieting falls this far under its own
                                   # level (another, weaker carrier on the channel); 0 = off.
                                   # Default 10 for traffic channels, off for paging.

[[radio.channels]]
label = "FG2"                      # county Fireground 2, PCFD / Rye Brook secondary (county list 2024-11-06,
mhz = 458.0375                     # docs/PLAN.md; GitHub #119): set up like FG1 (MDC / FleetSync IDs,
kind = "traffic"                   # mayday and emergency alarms, attach by radio ID)
device = "fire-fg2"
gain_db = 40

# HPN ATC (GitHub #233): Westchester County Airport tower, AM. Its transcripts feed the airport
# pre-alerts (sizeup/atc.py, the [atc] section below). Frequencies (FAA Chart Supplement via
# airnav.com/airport/KHPN, effective 2026-10-29): Tower 118.575 (0600-2300; CTAF when closed),
# Ground 121.825, Clearance Delivery 126.4 (127.25 when the tower is closed), D-ATIS 133.8,
# New York Approach 126.4 (0700-2300) / 120.8 (2300-0700) / 124.65, New York Departure 120.55.
# One RTL-SDR covers about 2 MHz: a channel's `also` (#275) puts other channels' frequencies on its dongle (rtl_sdr and
# one FFT channelizer, sizeup/radio/channelize.py: each frequency its own squelch, clips, speech-to-text and talkers,
# heard as the channel it belongs to), at most about 1.78 MHz between the lowest and highest at any time, and only with
# [radio] airband_multichannel = true (off by default: try it first with tools/airband_ab.py, an on-air A/B against
# rtl_fm), and only while no other running dongle has that frequency. One frequency: rtl_fm, as before. NY Approach and HPN Ground (#260) are below: picked for a dongle by hand, never
# auto-assigned. The facility comes from the label (sizeup/atc_scope.py): "... Ground" matches aircraft on the field,
# "... App" / "... Approach" HPN's arrivals and departures out to 40 NM. A frequency on two dongles at once is kept on
# one (the channel's own dongle).
[[radio.channels]]
label = "HPN Tower"
mhz = 118.575
kind = "airband"                   # AM, carrier squelch (sizeup/radio/am.py, shortfinal's settings)
device = "hpn-twr"
gain_db = 36.4                     # shortfinal's airband gain
squelch_db = 3.5                   # open this far over the noise floor (bench: noise +2, voice +6..+28)

[[radio.channels]]
label = "NY App 126.4/120.8"       # New York Approach for HPN (#260): early inbound, emergencies declared to it first
mhz = 126.4                        # the day frequency; schedule: each frequency from its local time (America/New_York,
kind = "airband"                   # DST-aware) until the next; retuned only between transmissions
schedule = [{ at = "07:00", mhz = 126.4 }, { at = "23:00", mhz = 120.8 }]
also = [{ mhz = 124.65, from = "07:00", until = "23:00" }]                  # 126.4 + 124.65 by day
device = "nyapp"

[[radio.channels]]
label = "NY App 124.65"            # New York Approach's third HPN frequency, fixed
mhz = 124.65
kind = "airband"
device = "nyapp2"

[[radio.channels]]
label = "HPN Ground"               # Westchester Ground (0600-2300 like the tower)
mhz = 121.825
kind = "airband"
schedule = [{ at = "06:00", mhz = 121.825 }, { at = "23:00", mhz = 124.65 }]   # closed overnight: 124.65 then
device = "hpn-gnd"

# Two-tone codes: every decoded pair is shown with its page so the real codes can be confirmed and
# named here (or in Settings > Radios > Tones). `ours = true` = opens incidents. A name is read as
# places + service ("Rye Brook FD" = Rye Brook · Fire, sizeup/cad/tonelist.py). PCFD answers both
# villages, so both are ours; 60 Control often stacks them on one page ("Rye Brook with Port Chester").
# Port Chester-Rye-Rye Brook EMS (928.1/510.5) is not ours.
[[tones]]
name = "Port Chester FD"           # Port Chester · Fire
a_hz = 903.2                       # heard on air, 60 Control tone tests 10-20 and 10-23-2026 (#47)
b_hz = 810.2                       # (the RadioReference wiki's 349.1/311.1 was never heard)
agency = "PCFD"
ours = true

[[tones]]
name = "Rye Brook FD"              # Rye Brook · Fire
a_hz = 767.4                       # heard on air, 60 Control tone tests 10-20 and 10-23-2026 (#47)
b_hz = 928.1
agency = "RBFD"
ours = true

[stt]
server_binary = "whisper-server"   # whisper.cpp server; the model stays loaded
model = "models/ggml-large-v3-turbo.bin"
port = 8179
threads = 8
beam_size = 0                      # whisper beam search width (0 = greedy). 5 = fewer garbled digit strings, ~10% slower
prompt = ""                        # optional vocabulary hint (can make the model insert words: off by default)
talker_prompt = "off"              # "ids": hint each call with who keyed up ("77 Alpha 4, 60 Control"); "ids+time": also its HHMM
# Amazon Transcribe streaming (docs/cloud.md "Speech-to-text per channel"). It runs on the hub
# (deploy/hub/config.hub.toml: aws = true); a station forwarding to the hub needs nothing here.
# All-in-one with AWS credentials in the environment could set aws = true too.
# aws = false
# aws_region = ""                  # "" = AWS_REGION / AWS_DEFAULT_REGION, else us-east-1
# aws_channels = ["South 2", "FG1", "FG2", 307, "HPN Tower"]   # engine "aws" by default; Settings > Radios changes any
#                                  # channel (left out: every airband channel is added, #233)
# record_only = []                # e.g. [383, 3127]: recorded, not transcribed unless Settings says so
# aws_monthly_limit_usd = 25       # until Settings > Radios sets one; reached: AWS channels use whisper
# aws_idle_s = 120                 # a channel's stream ends this long after its last transmission
# aws_pace = 2.0                   # audio sent this many times faster than real time
# aws_vocabulary = "sizeup-pcfd"   # the custom vocabulary (Settings > Radios > Vocabulary, Push)
# aws_endpoint = ""                # tests / dev only: a local fake (ws://127.0.0.1:9431)
# aws_api_endpoint = ""            # tests / dev only: a local fake of the JSON API (http://127.0.0.1:9432)

[p25]
# trunk-recorder capture directory (Westchester County P25, South simulcast site). Empty = no P25.
capture_dir = "captures/p25"            # where trunk-recorder writes calls
recorder = "~/.local/src/trunk-recorder/build/trunk-recorder --config=config.json"
recorder_dir = "deploy/trunk-recorder"  # its config.json + talkgroups.csv
talkgroups_file = "deploy/trunk-recorder/talkgroups.csv"   # names for all recorded talkgroups
incident_talkgroups = [307, 333]   # Fire/EMS 15 (Battalion 15) + Airport Incident attach to our incident
aliases = {}                       # radio ID -> unit name, e.g. { "2391001" = "2391" }
# The emergency button opens a window: every call on that talkgroup, and the radio that pressed it on any
# talkgroup, is kept this long after its last emergency key-up, even with the talkgroup's Record switched
# off (sizeup/cad/alarms.py Windows). The alarm's "All clear" ends it early. 0 = keep only the flagged call.
emergency_window_min = 10

[mdc]
# MDC-1200 PTT-ID (Motorola radios send it on key-up/release): radio ID -> unit name shown on traffic.
aliases = {}                       # e.g. { "0611" = "Engine 60" }

[units]
# Apparatus -> department, from the county mutual aid plan roster (2021; data/westchester_apparatus.csv).
# A page naming one of our units opens an incident even when its tones aren't known yet.
apparatus_file = "data/westchester_apparatus.csv"
departments = {}                   # overrides / additions, e.g. { "Engine 65" = "Port Chester FD" }
# Chief officers by callsign (dept number 239 + rank digit). Shown on P25 talkers ("2398 Duty Officer")
# and matched in pages, which then count as Port Chester.
callsigns = { "2391" = "Chief of Department", "2392" = "1st Assistant Chief", "2393" = "2nd Assistant Chief", "2395" = "Immediate Past Chief", "2398" = "Duty Officer" }

[storage]
clips_dir = "captures/clips"
keep_hours = 24                    # pages, incidents, transcripts
audio_keep_hours = 12              # every WAV under captures/ (clips, skipped clicks, P25 calls); cleaner runs every 10 min
# The hub's audio.sqlite (docs/cloud.md "Audio retention"): clips on a CAD event, with an alarm or an emergency are
# kept this many days instead (0 = forever); deleted in transactions of audio_prune_batch rows; free pages handed
# back only in the off-peak hours [start, end), New York time.
# audio_keep_event_days = 365
# tier_keep_days = { alert = 30, text = 0, record = 7 }   # another P25 system's talkgroups, by tier (#409); 0 = audio_keep_hours
# context_audio_max_mb = 100       # hub: another P25 system's clips at most (their own budget, inside the audio cap)
# audio_prune_batch = 200
# audio_offpeak = [2, 5]

[map]
home_lon = -73.6640
home_lat = 41.0130
home_zoom = 13.4

[geo]
# The CAD location box's intersection search (#213): "N Main St / Westchester Ave", "n main & west". The towns it
# searches (as the gazetteer names them); results in Port Chester and Rye Brook first, then the rest nearest
# headquarters first. Leave out for these defaults.
search_towns = ["Port Chester", "Rye Brook", "Rye", "Harrison", "Greenwich", "Mamaroneck", "Larchmont",
                "Town of Mamaroneck"]
hq_lat = 41.00253                  # PCFD Headquarters, 209 Westchester Ave
hq_lon = -73.66692

[cad]
# PCFD self-dispatch console (/cad). Incidents, units, run cards and the dispatch log live in one
# SQLite file, outside captures/ (whose cleaner deletes old files).
db = "state/cad.sqlite"
department = "Port Chester Fire"   # first words of every dispatch, as said on the air
# Event types, subtypes, dispositions, unit statuses, the two unit boards, colors and the dispatch
# wording, from the department's sheet ("[TEMPLATE] PCFD ECC OPS"). Replace the file to change them.
lists = "data/cad_lists.json"
monitor_departments = ["Port Chester FD", "Rye Brook FD"]   # their tones, or an address in their town -> an event to accept

[dispatch]
# Alert tones before the voice: [hz, seconds] in order (two-tone sequential). Port Chester Fire's pair
# as 60 Control sends it: heard on air, 60 Control tone tests 10-20 and 10-23-2026 (#47). Rye Brook's
# (767.4/928.1) are data/cad_lists.json dispatch_tones, played after these when its units go.
tones = [[903.2, 1.0], [810.2, 3.0]]
# The voice: Kokoro-82M, a local neural text-to-speech model, run by sizeup on 127.0.0.1:tts_port (CPU).
# Set it up once with tools/setup_tts.sh (~1.3 GB in ~/.local/share/sizeup/tts). While its server is
# down, erroring or slower than 10 s, dispatches use macOS `say` with fallback_voice (noted on each one).
# tts_engine = "polly": Amazon Polly over the internet (the hub's choice, deploy/hub/config.hub.toml):
# needs AWS credentials (AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY, or the ECS task role) allowed
# polly:SynthesizeSpeech; voice = "Matthew" (default), "Stephen", "Gregory", "Joey" (men) or "Joanna",
# "Ruth", "Danielle"; best engine first (generative, neural, standard); speed is said as SSML prosody.
# polly_region = "us-east-1"       # default: AWS_REGION / AWS_DEFAULT_REGION, else us-east-1
tts_engine = "kokoro"              # "kokoro" | "polly" | "say" (macOS `say` only, with `voice` a `say -v` voice) |
                                   # "none" (no voice here: a Linux station whose hub speaks with Polly; text only locally)
voice = "af_heart"                 # Kokoro voice: af_/am_ American, bf_/bm_ British (GET /api/cad/tts/voices)
speed = 0.92                       # Kokoro / Polly speaking speed, 0.5-2.0 (1.0 = the voice's own pace)
tts_port = 8093
fallback_voice = "Samantha"        # macOS `say -v` voice (`say -v '?'` lists them)
# tts_python = "~/.local/share/sizeup/tts/venv/bin/python"   # the default
rate = 0                           # `say` words per minute (0 = the voice's own pace)
repeat = 2                         # the voice part read this many times
# Transmit stays OFF in this version: there is no radio interface yet (M2: a sound-card + PTT
# interface into a PCFD radio, with the department's authorization). "Dispatch" logs what would
# have gone out and plays it in the browser. true is refused at startup.
transmit = false
channels = ["FG1", "PC repeater"]  # labels on the dispatch log only (FG1, or the PC repeater as PCFD's paging channel)

# [cloud]: run the CAD in the cloud for people away from this machine (docs/cloud.md). Leave it out
# for today's all-in-one. This machine (with the SDRs, whisper and the voice) is then the "station":
# it runs everything as before and forwards what it hears to the hub over outbound HTTPS only.
# The hub's own config is deploy/hub/config.hub.toml. Forwarding is switched on and off in the CAD,
# Settings > System > Station (kept in state/cloud.json, which then wins over role / hub_url here);
# secrets from the environment, this section, or the macOS Keychain (deploy/station/README.md).
# [cloud]
# role = "station"                   # the default until the switch is first used; leave out: off
# hub_url = "https://sizeup.example.org"   # the hub (behind Cloudflare Access: see docs/cloud.md)
# token = ""                         # the station's bearer token; better: env SIZEUP_STATION_TOKEN (same on the hub)
# access_client_id = ""              # Cloudflare Access service token for /api/station/* (or env
# access_client_secret = ""          #   SIZEUP_ACCESS_CLIENT_ID / SIZEUP_ACCESS_CLIENT_SECRET); "" = not used
# outbox = "state/outbox.sqlite"     # everything for the hub waits here while it's unreachable
# outbox_max_mb = 300                # queued audio over this: the oldest clips are dropped (never the transcripts)
# keychain_prefix = "sizeup"         # Keychain services sizeup-station-token, sizeup-access-id, sizeup-access-secret
#                                    #   (or keychain_token / keychain_access_id / keychain_access_secret)

# [prealert]: the phone pre-alert. Tapout (an ESP32 on the PCFD headquarters phone line, repo
# firehouse-ring-alerter) posts to ntfy.sh when the station's phone rings; the CAD shows each ring
# at the top of its 60 Control column as a possible incoming call, until a 60 Control page for Port
# Chester or a new emergency event matches it, someone dismisses it, or expire_min passes. Tapout's
# status topic (hourly heartbeat, restarts, warnings) shows as "Tapout: ok, heartbeat 12 min ago".
# READ ONLY: sizeup only subscribes (GET). NEVER publish to these topics, from sizeup or by hand to
# "test" it: pcfd-phone-prealert is the fire crew's real alert channel and pages their phones.
# Runs on the CAD of record only: all-in-one, or the hub. While this station forwards to a hub it
# doesn't subscribe (the hub does; two would double-alert). Leave the section out to turn it off.
[prealert]
enabled = true
server = "https://ntfy.sh"           # or env SIZEUP_PREALERT_SERVER (a local test server)
ring_topic = "pcfd-phone-prealert"   # real rings only (Tapout's ntfy_call)
status_topic = "pcfd-status"         # boot, hourly heartbeat, errors, OTA (Tapout's ntfy_status)
expire_min = 5                       # an unanswered pre-alert ends after this long
heartbeat_stale_min = 90             # no heartbeat (or restart) this long: "Tapout: no heartbeat for ..." in warning

# [atc]: airport pre-alerts from HPN ATC (GitHub #233, sizeup/atc.py): every transcript of an airband channel
# (above: HPN Tower), read with the few transmissions before it, through the rules in data/atc/rules.json
# (fire / smoke / brush fire, MAYDAY, PAN-PAN, declaring an emergency, souls on board, ARFF / roll the trucks,
# disabled aircraft, gear, engine, bird strike, fuel, medical, laser). A hit is an airport pre-alert at the
# top of the CAD's 60 Control column with the transcript and its audio, the aircraft (the callsign matched to
# the Aircraft layer), the location words and an approximate point only when the words give one; Accept
# makes a pending event (nothing is dispatched), Dismiss says it's nothing. Pushed once to [alerts]
# ntfy_topic. On the CAD of record only (the hub, or all-in-one). Leave it out for the defaults.
# [atc]
# enabled = true
# rules = ""                         # "" = data/atc/rules.json (weights, words, what never counts)
# context = 4                        # earlier transmissions on the channel read with each one (the exchange) ...
# context_s = 120                    # ... no older than this
# dedupe_min = 5                     # the same subject again within this: added to the open pre-alert
# expire_min = 30                    # nobody answered: expired
# max_per_hour = 8                   # new pre-alerts an hour at most (more: added to the latest open one)
# alert_level_incident = [2, 3]      # #369: 60 Control's "alert level N": these levels (PCFD responds) also make a
#                                    #   queued Airport incident (never dispatched); Alert 1 is always a standby pre-alert,
#                                    #   never an incident (1 is refused here). Not [atc] enabled's: the fire radio's
# airport_names = ["westchester", "west chester", "hpn", "white plains"]   # ours: an alert naming another airport
#                                    #   (Danbury, Teterboro ...) and none of these is not HPN's

# [alerts]: our own ntfy topics for pushes that page a person (sizeup/notify.py), two kinds:
#   ntfy_topic    the alarms: the emergency buttons (P25, MDC, FleetSync), a mayday heard on our fire channels
#                 (sizeup/cad/alarms.py, #128), an aircraft emergency squawk near HPN, each at max priority with
#                 who and where, and their acknowledgement, all clear and "Ended" notices
#   status_topic  the system's health: station health (the hub, #79; docs/cloud.md "Station health and alerts"):
#                 the station silent, behind, failed to update, a dongle / program down, a stuck channel, its
#                 outbox backing up, its disk filling, its whisper queue behind; Amazon Transcribe failing and
#                 its monthly budget at 80 % / 100 %; shown as a banner on /cad and /monitor, logged, and pushed
#                 (at most once per alert per repeat_min, plus its recovery)
#   intel_topic   radio pre-alerts (sizeup/intel: police / fire chatter, what and where); empty: the alerts topic
# Only one of ntfy_topic / status_topic set: everything goes to it. ntfy topics are public by name: long random ones (e.g.
# `openssl rand -hex 12`). NEVER Tapout's topics (pcfd-phone-prealert pages the fire crew; pcfd-status):
# refused (by exact name) here and again before every send. Empty or left out: no pushes. Env
# SIZEUP_ALERT_TOPIC / SIZEUP_STATUS_TOPIC / SIZEUP_INTEL_TOPIC / SIZEUP_ALERT_SERVER win, and Settings > System > Push
# notifications (admins) wins over both, live.
# [alerts]
# ntfy_topic = ""
# status_topic = ""
# intel_topic = ""
# ntfy_server = "https://ntfy.sh"
# silent_min = 3                     # station health: no state post from the station this long
# behind_min = 15                    # on another build than the hub this long
# down_min = 2                       # whisper or trunk-recorder down this long
# outbox_min = 5                     # the oldest event waiting on the station this old
# disk_pct = 90                      # the station's disk this full
# repeat_min = 15                    # at most one push per alert this often (plus its recovery)
# p25_silent_min = 20                # "P25 trunk silent": no call on ANY talkgroup this long (trunk-recorder running;
# p25_silent_night_min = 60          #  longer when the system's learned gaps say so); 60 min into the night (00-06).
#                                    # One talkgroup or channel silent is only a hint. (main_channels: no more, ignored)

# [roads]: the CAD maps' highway layers (sizeup/roads.py, docs/cloud.md "Highway layers"): traffic
# cameras, incidents and closures, roadwork and message signs for our area, from the NYS Thruway
# Authority's public feeds (I-95, I-287; no key; on by default) and from 511NY on CARS (#188): its public
# message signs (on by default), and with its username and password (env SIZEUP_511NY_USER / SIZEUP_511NY_PASS,
# never here) the CARS API's incidents, closures and roadwork and the CARS-Hub's CCTV cameras. 511NY asks
# for once every 5 minutes at most. Camera snapshots go through this process, never from the browser to a
# provider. The mileposts and exits are the gazetteer's. Try 511NY's feeds once by hand: tools/ny511_probe.py.
# [roads]
# thruway = true
# county = true                          # Westchester County DPW's cameras (no key)
# ny511 = true                           # 511NY's feeds (signs now; events and CARS-Hub with the credentials)
# events_url = ""                        # "" = 511NY's (the CARS API's /events), "off" = none
# signs_url = ""                         # "" = 511NY's (https://nyapi.carsprogram.org/signs.json), "off" = none
# ny511_hub = ""                         # "" = https://nysdot.carsprogram.org/hub/ (its data/cctv.xml), "off" = none
# carshub_imagery = true                 # the CARS-Hub's new cameras on the map, wall and overlay (false: only counted)
# bbox = [-73.80, 40.92, -73.56, 41.10]   # west, south, east, north: Port Chester, Rye Brook, neighbours
# events_every_s = 300                    # at least 300 (511NY: once every 5 minutes)
# signs_every_min = 5                     # at least 5
# cameras_every_min = 60                  # at least 10
# stream_max = 8                          # live camera streams through the hub at once (a camera watched by several
#                                         # pages is one); each ~26 KB/s and ~1.4 % of a core: 8 is safe on 0.25 vCPU
# wall_streams = 0                        # the camera wall's live tiles per page; 0: every streaming camera in our area
# Camera DVR (#277, sizeup/dvr.py): the live cameras' segments kept on the hub's disk so the viewer can scrub back.
# Only cameras with live video, on demand: the always list, the ones pinned in the viewer, an open event's cameras,
# the ones being watched (and dvr_linger_min after). Behind Cloudflare Access like the rest; never public.
# dvr = true
# dvr_window_min = 120                    # kept per camera (10 to 720)
# dvr_max_gb = 6                          # every camera's segments together, at most (0.5 to 200); oldest go first
# dvr_near_m = 1000                       # an open CAD event's cameras: this close (0 to 5000), and the ones along the road
# dvr_linger_min = 30                     # a camera someone opened records on this long after they close it (0 to 240)
# dvr_max_cameras = 12                    # recorded at once (1 to 40): ~200 kbit/s each in, 175 MB each per 2 h
# dvr_always = []                         # camera ids recorded all the time
# dvr_dir = ""                            # "" = the state folder's dvr/
# On storage shared between tasks (#322: EFS at dvr_dir) the recording outlives a deploy: the response area's cameras
# around the clock, 12 h. The response area is the camera wall's (Settings > System: our fire districts, its margin,
# its include / exclude), plus dvr_extra_m beyond its margin.
# dvr_shared = "auto"                     # "auto": an nfs4 / efs mount at dvr_dir; true / false: force it
# dvr_extra_m = 1000                      # beyond the camera wall's margin, still recorded (0 to 5000): 8 cameras
# dvr_area = []                           # an override: [[lon, lat], ...] or [west, south, east, north]; [] = none
# dvr_shared_window_min = 720             # kept per camera on shared storage (10 to 2880)
# dvr_shared_max_gb = 25                  # ~1 GB per camera per 12 h (0.5 to 2000)
# dvr_shared_max_cameras = 20             # recorded at once on shared storage (1 to 64)

# [roadwork]: the maps' "Road projects & closures" layer and the incident view's closure lines (sizeup/roadprojects.py,
# #185): the Thruway's and 511NY's roadwork (read by [roads]), the capital programs in construction (the Thruway, NYSDOT,
# CTDOT in Greenwich), and the road notices in the public RSS feeds of Port Chester, Rye Brook and Greenwich (placed on
# the map only when their words name a block, an address or a corner the gazetteer confirms). Read by the hub only
# while someone looks. Leave the section out: all of these.
# [roadwork]
# enabled = true
# projects = true                        # the capital programs (public ArcGIS / XML, no key)
# notices = true                         # the villages' RSS road notices
# wzdx = true                            # 511NY's WZDx (the CARS API, [roads]' username and password): on with them
# wzdx_url = ""                          # any other public WZDx feed: off until set

# [weather]: NWS alerts (the banner), conditions (the header), radar (the maps' Layers) and NOAA tides (marine
# calls, the board's marine block): sizeup/weather.py, docs/cloud.md "Weather and water". Public data, no key,
# fetched by the hub (or all-in-one), cached under the state dir (weather.json). Leave the section out: these.
# [weather]
# enabled = true
# radar = true
# zones = ["NYZ071", "NYC119", "NYZ211"]  # Southern Westchester (forecast), Westchester (county), fire weather
# marine_zones = ["ANZ335"]               # Long Island Sound west of New Haven / Port Jefferson: the marine block
# area = "Southern Westchester"           # how a spoken warning names us
# station = "KHPN"                        # NWS observation station: Westchester County Airport
# tide_station = "8518091"                # CO-OPS predictions: Rye Beach
# gauge_station = "8516945"               # CO-OPS water-level gauge: Kings Point

# [routing]: the rigs' probable paths on the CAD maps and the arrival estimates by road (sizeup/roadgraph.py, #360):
# a road graph from OpenStreetMap (one Overpass query, monthly in Settings > Data sources), the firehouses plus
# ring_km around them, cached under the state dir (roadgraph.json). The hub (or all-in-one) only. Leave it out: on.
# [routing]
# enabled = true
# ring_km = 12
# overpass_url = "https://overpass-api.de/api/interpreter"

# [gis]: the CAD maps' "County GIS" layers (sizeup/gis.py, docs/cloud.md "County GIS layers"): Westchester
# County GIS open data (tax parcels, fire and EMS districts, hydrants, buildings, flood plains, rail ...),
# fetched by the hub (or all-in-one) from the county's ArcGIS REST services on a slow schedule, cached
# under the state dir (gis/<key>.geojson) and served to the browsers from here; the starter set is
# sizeup/gis.py DEFAULT_LAYERS, each with its terms. No key needed. Leave the section out: the starter
# set as is. One [[gis.layers]] entry with a starter key changes that entry; a new key adds a dataset.
# [gis]
# enabled = true
# bbox = [-73.80, 40.92, -73.56, 41.10]   # west, south, east, north: the area kept, unless a layer has its own
# [[gis.layers]]
# key = "parcels"                         # a starter entry: only what is set here changes
# on = true                               # on for a viewer who hasn't chosen
# [[gis.layers]]
# key = "zoning"                          # a new dataset: one entry, no code
# label = "Zoning districts"
# group = "Boundaries"                    # the sub-heading in the Layers box
# url = "https://giswww.westchestergov.com/arcgis/rest/services/DataHub_EnvironmentandPlanning/MapServer/207"
# fields = [["ZONING", "Zone"], ["ZONE_NAME", "Name"], ["MAX_HGHT", "Max height"], ["STORIES", "Storeys"]]   # shown on a click, first = title
# style = { color = "--warn", fill = 0.08, width = 1 }   # a design token or "#hex"; fill (opacity), width, radius, dash, label, labelzoom
# icon = "hydrant"                       # a point layer's mark (static/icons.svg i-gis-<icon>: hydrant, fire-station, police,
                                        # hospital, nursing-home, school, worship, ambulance, train, bus, petroleum, tank); none: a dot
# sub = "Petroleum bulk storage (NYSDEC PBS)"   # under a feature's title in the click box (none: the label)
# trains_field = "STATNAME"              # a station layer: the field naming the station; its copies of the stations the
                                        # Trains layer draws (within 250 m, or 1 km by name) are left out while that layer is on
# minzoom = 13                            # drawn from this zoom ("zoom in" below it)
# refresh = "monthly"                     # hourly | daily | weekly | monthly
# tiled = false                           # true: served by viewport (a big layer: the parcels, the buildings)
# simplify_m = 1.0                        # Douglas-Peucker tolerance in metres (0: as drawn)
# where = "MUN = 'Port Chester'"          # an extra SQL filter; bbox = [...] its own box
# licence = "Westchester County GIS disclaimer: public, as is"   # recorded here and in docs/cloud.md
# page = "https://gis.westchestercountyny.gov/datasets/<item>_207"

# [trains]: Metro-North's New Haven Line on the CAD maps and "Trains approaching" for an event near the
# tracks (sizeup/trains.py, docs/cloud.md "Metro-North trains"): the MTA's public GTFS-realtime and static
# GTFS feeds, read by the hub (or all-in-one); the realtime one only while someone looks. No key needed
# (2026-10-14); should the MTA require one again: env SIZEUP_MTA_KEY (the hub: SSM /sizeup-hub/mta-key).
# Leave the section out: on, the MTA's feeds, Mount Vernon East to Stamford on the map.
# [trains]
# enabled = true
# bbox = [-73.845, 40.900, -73.530, 41.060]   # west, south, east, north: the stretch of line the map shows
# rt_url = ""                                  # "" = the MTA's (sizeup/trains.py RT_URL); a test feed's address
# gtfs_url = ""                                # "" = the MTA's (GTFS_URL)
# rt_every_s = 5                               # the realtime feed this often while someone looks (5 to 300 s)
# traintime = true                             # MTA TrainTime (undocumented; sizeup/traintime.py, #362): GPS, cars,
#                                              # load, milepost, track; GTFS-realtime the fallback when it fails
# traintime_url = ""                           # "" = the MTA's (traintime.py BASE_URL); a test server's address
# traintime_every_s = 5                        # TrainTime this often while the layer is on or an active incident is
#                                              # within 1 km of the line (5 to 60 s); otherwise every 30 s

# [aircraft]: aircraft near HPN on the CAD maps (sizeup/aircraft.py, docs/cloud.md "Aircraft near HPN", #155):
# shortfinal's PCFD-focused picture (arrivals, departures, ground traffic at HPN, low traffic in the area,
# emergencies; overflights left out), read by the hub (or all-in-one).
# feeds, combined (the union by aircraft, the freshest position each; user, 2026-10-14: "adsb.lol as primary or
# adsb.fi whichever gives the most data, and then keep that data, but poll between the two as needed if one loses
# or is rate limited"):
#   "adsblol"   adsb.lol, keyless, ODbL (credited on the map)
#   "adsbfi"    adsb.fi: its terms say personal, non-commercial use only. The user's decision, 2026-10-14: this is
#               personal, non-commercial use ("we are not charging for this"). Credited on the map.
#   the busier of the two is primary (every 5 s while the layer is open), the other every 10 s; one that errors or
#   is rate-limited rests (Retry-After, else exponential) and the other carries on.
#   "receiver"  our own ADS-B receiver ([aircraft.receiver] below): when enabled it is always first ("primary local
#               SDR on ADSB, secondary the above sources").
# OpenSky is not used (a written agreement for operational use; far too few credits for a 5 s refresh).
# alarms: a squawk 7500 / 7600 / 7700 (or the aircraft's own emergency status) within radius_nm below 18,000 ft
# raises the emergency alarm on every console, and its push through [alerts] ntfy_topic when one is set; the hub
# then reads the primary feed every 15 s even when nobody has the map open.
# registry: types (make / model) from the FAA Releasable Aircraft Database, public domain, ~70 MB a week once
# someone has looked; never the owner's name. Leave the section out: on, both APIs, 15 nm around HPN, alarms on.
# [aircraft]
# enabled = true
# feeds = ["adsblol", "adsbfi"]
# alarms = true
# radius_nm = 15          # around HPN: the feeds' query, what counts as "in the area", the alarm's area
# ceiling_ft = 6000       # MSL: below this inside the radius is "low traffic" (shortfinal's focus)
# registry = true
#
# Our own receiver (GitHub #235): the dongle behind a 1090 MHz filter and an LNA, by its exact USB serial (never all
# digits: rtl_eeprom -d <index> -s adsb1090), named here or in Settings > Radios (admins, with a confirm; that choice
# wins). Named, it is never one of sizeup's radios and auto-assign never takes it; on the Linux station
# sizeup-adsb.service runs readsb on it (and nothing else), with gain and bias_tee from here, and the station sends
# what it hears to the hub, whose map puts our positions first while fresh (adsb.lol / adsb.fi when we lose a plane).
# The decoder holds the dongle's claim (~/.local/state/rtl-claims) and never starts while another app holds it.
# enabled: this process's own map reads the receiver (all-in-one); json_1090 / json_978: another decoder's
# aircraft.json (readsb / dump1090, dump978-fa), a path or an http(s) URL; the default with a dongle named is the
# decoder's /run/sizeup-adsb/json/aircraft.json.
# [aircraft.receiver]
# sdr = ""                                   # e.g. "adsb1090"
# gain = "auto"                              # readsb --gain: auto (an LNA makes a fixed high gain overload), or dB
# bias_tee = false                           # true ONLY for an LNA powered up the coax (4.5 V)
# enabled = false
# json_1090 = ""                             # e.g. "/run/readsb/aircraft.json" or "http://127.0.0.1/tar1090/data/aircraft.json"
# json_978 = ""                              # e.g. "/run/skyaware978/aircraft.json"

# [vessels]: AIS ships and boats on western Long Island Sound (sizeup/vessels.py, docs/vessels.md, #402), read by the
# hub (or all-in-one). aisstream.io only with a key (env SIZEUP_AISSTREAM_KEY; the hub: SSM /sizeup-hub/aisstream-key;
# never in a committed file); no key: that source is off. Anything outside bbox is dropped.
# [vessels]
# enabled = true
# bbox = [-73.83, 40.78, -73.50, 41.07]     # west, south, east, north: Throgs Neck to Stamford, CT shore to LI's north shore
#
# Our own AIS receiver: AIS-catcher on one RTL-SDR at the station (sizeup-ais.service; deploy/station/README.md
# "AIS receiver"), by its exact USB serial; never one of sizeup's radios. Off until the dongle and antenna are in.
# [vessels.receiver]
# enabled = false
# sdr = ""                                   # e.g. "ais162"
# gain = "auto"                              # or dB
# ppm = 0                                    # a non-TCXO dongle's correction
